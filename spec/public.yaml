        - Exports
      summary: 'Request an export'
      description: "The required ability depends on `type`: `messages_csv` needs `reports:read`, `contacts_csv` and\n`contact_json` need `contacts:read`, `campaign_report` needs `campaigns:read`, `account_zip` needs `account:write`.\n`messages_csv` takes the `GET /v1/messages` filters as `params`; `created_after` and `created_before` are required\nand at most 366 days apart. A key restricted to inboxes exports only its inboxes. The export is built\nasynchronously: poll `GET /v1/exports/{id}` or wait for the `export.completed` webhook.\n\nErrors: `422 VALIDATION_FAILED` (unknown `type` or invalid `params`), `403 ABILITY_MISSING`.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              allOf:
                -
                  if:
                    properties:
                      type:
                        const: messages_csv
                    required:
                      - type
                  then:
                    required:
                      - params
                    properties:
                      params:
                        type: object
                        required:
                          - created_after
                          - created_before
                        properties:
                          created_after:
                            type: string
                            format: date-time
                          created_before:
                            type: string
                            format: date-time
                            description: 'Later than `created_after`, at most 366 days after it.'
                -
                  if:
                    properties:
                      type:
                        const: contact_json
                    required:
                      - type
                  then:
                    required:
                      - params
                    properties:
                      params:
                        type: object
                        required:

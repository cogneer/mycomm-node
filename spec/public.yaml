      summary: "Read a conversation's thread"
      description: "The messages of one conversation, newest first by default. Requires `conversations:read`.\nBoth sort directions use `COALESCE(phone_timestamp, created_at)`, so imported history keeps the time the phone\nrecorded; `created_after` (inclusive) and `created_before` (exclusive) use the same time. Ties break on `id`.\n`q` is the full-text search on `body` of `GET /v1/messages` (at least 2 characters). A conversation outside the\nkey's inbox scope answers 404.\n"
      parameters:

    post:
      operationId: createTemplate
      tags:
        - Templates
      summary: 'Create a template'
      description: "Requires `templates:write`. `body` uses the variable syntax (`{{ name }}`,\n`{{ name | \"fallback\" }}`); a syntax error answers `422 TEMPLATE_INVALID` with `details.position`. Names are\nunique among non-archived templates, ignoring case (`409 NAME_TAKEN`). A body linking through a public URL\nshortener answers `422 LINK_PUBLIC_SHORTENER`, one estimated over 10 SMS parts `422 BODY_TOO_LONG`. Variables\nthat are neither contact nor custom fields are allowed (they must be supplied at send) and listed in\n`warnings`. `media_id` must be a media item of the account.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:

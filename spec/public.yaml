  '/channels/{id}/rate-policy':
    patch:
      operationId: updateChannelRatePolicy
      tags:
        - Channels
      summary: 'Update the rate policy of a channel'
      description: "Requires `channels:write`; a key restricted to inboxes never holds it. Sent keys are merged\ninto the current policy (nested objects key by key; a key sent as `null` clears it where the field allows\n`null`) and `rate_policy_source` becomes `custom`. `{\"reset_to_suggested\": true}` restores the suggestion\n(`rate_policy_source: suggested`) and clears the acknowledgement; it cannot be combined with policy fields.\nA body that changes nothing is `422 VALIDATION_FAILED`.\n\nChecks run in this order and the first failure answers:\n\n1. Shape and field bounds, `422 VALIDATION_FAILED`: every cap at least 1 and\n   `per_min <= per_15m <= per_hour <= per_day`, `interval_ms.min >= 60000 / ceiling.per_min`,\n   `interval_ms.max` between `min` and 600000, `bulk_hours` within 07:00 to 22:00 sender-local.\n2. Every cap at or below the channel's `rate_policy_ceiling`, else `422 ABOVE_PLATFORM_CEILING` with\n   `{field, value, ceiling, reason}` (`platform`, `country`, `override_limit`, `new_account` or\n   `restricted_country`). During the first 14 days of the account the suggestion is also the shortest wait\n   allowed: `interval_ms.min` below the suggested shortest wait, or `interval_ms.max` below the suggested\n   longest wait, answers `422 ABOVE_PLATFORM_CEILING` with `reason: new_account`; for these two fields `value`\n   and `ceiling` are waits in milliseconds and `ceiling` is the shortest wait allowed. A cap above its\n   ceiling is answered first. Acknowledging the risk never lifts a ceiling. After day 14 only step 1 limits a\n   wait. `rate_policy_ceiling` itself holds caps only.\n3. The risk of the result: saving `amber` or `red` needs `acknowledge_risk: true`, again\n   whenever the risk rises above the acknowledged level, else `422 RISK_ACKNOWLEDGEMENT_REQUIRED` with\n   `{risk, exceeds}`.\n\nSaving sets `acknowledged_risk_at` and is audited as `channel.rate_policy.updated`. While the SIM safety band is\n`poor` or `critical` a custom policy is also capped at the suggestion times the band factor; the\nstored policy is unchanged and applies again when the band recovers. `404` when the channel is not found in the\naccount.\n"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          $ref: '#/components/parameters/MyCommAccount'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelRatePolicyUpdate'
      responses:
        200:
          description: 'The channel with its refreshed rate policy, source, risk and ceiling.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        413:
          $ref: '#/components/responses/PayloadTooLarge'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        422:
          $ref: '#/components/responses/ChannelRatePolicyUnprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'

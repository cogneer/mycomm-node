  /contacts:
    get:
      operationId: listContacts
      tags:
        - Contacts
      summary: 'List contacts'
      description: "Requires `contacts:read`. Live (not soft-deleted) contacts of the account with cursor pagination. Comma lists match any of the values. `q` matches the name, email and any address\n(case-insensitive, at least 2 characters; a phone-like search is also matched against the digits of the\nstored number, so `3451234` finds `+923451234567`). `display_name` sorts with ICU collation; contacts without\na name sort first and ties break on `id`.\n"
      parameters:
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
        -
          name: q
          in: query
          description: 'Name, email or address contains, at least 2 characters.'
          schema:
            type: string
            minLength: 2
        -
          name: address
          in: query
          description: 'Matches any identity address (comma list).'
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        -
          name: identity_type
          in: query
          description: 'Comma list.'
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        -
          name: group_id
          in: query
          description: 'Members of any of these groups (comma list).'
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        -
          name: smart_list_id
          in: query
          description: 'Members of this smart list, evaluated live; an id that is not a smart list of the account answers `422`.'
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: source
          in: query
          description: 'Comma list.'
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        -
          name: language
          in: query
          description: 'Comma list.'
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        -
          name: blocked
          in: query
          description: '`true` = any identity is blocked.'
          schema:
            type: boolean
        -
          name: created_after
          in: query
          description: 'Inclusive lower bound.'
          schema:
            $ref: '#/components/schemas/Timestamp'
        -
          name: created_before
          in: query
          description: 'Exclusive upper bound.'
          schema:
            $ref: '#/components/schemas/Timestamp'
        -
          name: updated_after
          in: query
          description: 'Inclusive lower bound.'
          schema:
            $ref: '#/components/schemas/Timestamp'
        -
          name: sort
          in: query
          schema:
            type: string
            enum:
              - '-created_at'
              - created_at
              - display_name
              - '-display_name'
              - '-updated_at'
              - updated_at
            default: '-created_at'
        -
          $ref: '#/components/parameters/MyCommAccount'
      responses:
        200:
          description: 'A page of contacts.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/ListEnvelope'
                  -
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Contact'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
      x-codeSamples:
        -
          lang: Shell
          label: curl
          source: "curl -X GET \"$MYCOMM_URL/v1/contacts\" \\\n  -H \"Authorization: Bearer $MYCOMM_API_KEY\""
    post:
      operationId: createContact
      tags:
        - Contacts
      summary: 'Create a contact'
      description: "Requires `contacts:write`. At least one identity; `phone` is the only type in v1 (`422 IDENTITY_TYPE_UNAVAILABLE`\nfor the others) and the address is normalised to E.164 using the account country (`422 INVALID_NUMBER`). A\nnumber held by another contact answers `409 IDENTITY_TAKEN` with `details.contact_id`. `custom_fields` keys must\nbe defined contact fields. `group_ids` adds the memberships. Emits `contact.created`.\n"
      requestBody:
        required: true

  '/inboxes/{id}/automation-rules/test':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: testAutomationRule
      tags:
        - Automation
      summary: 'Test a message against the automation of an inbox'
      description: "Requires `automation:read`. A dry run: the inbox's rules and guards decide what an inbound\nmessage with this `body` would do, and nothing is sent, written or logged. `at` (default now) is the instant\nused for business hours and the guard windows. With `contact_id` the per-conversation guards (loop guard,\ncooldown) read that contact's conversation in the inbox; without it only the channel cap applies. A guard\noutcome (`skipped:*`) still names the rule and lists its actions and reply preview, and `outcome` says why\nnothing would be sent. `no_match` means no rule fits or the message runs no automation at all (an opt-out\nkeyword, for example): no rule, no actions and no preview. A key restricted to inboxes tests only its own\ninboxes; another inbox, or one of another account, is `404`. The reply preview renders the contact's fields,\nso a `contact_id` also needs `contacts:read` (`403 ABILITY_MISSING`, checked before the contact is looked\nup). A `contact_id` that is not a contact of the account is `422 VALIDATION_FAILED`, as is any field not\nlisted here. The body is JSON, at most 128 KB (`413 PAYLOAD_TOO_LARGE`); anything else is\n`400 MALFORMED_REQUEST`.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationDryRunRequest'
      responses:
        200:
          description: 'What the automation would do.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:

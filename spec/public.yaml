      operationId: createApiKey
      tags:
        - 'API keys'
      summary: 'Create an API key'
      description: "Requires `keys:write`. Abilities default to the preset for the key's scope, must be a subset of the calling key's,\nand a restricted key cannot hold the abilities marked with a cross there. A restricted caller can\ncreate keys only inside its own scope. `partner` keys are never created here. The `token` is shown\nonce, in this response.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                inbox_ids:
                  oneOf:
                    -
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '#/components/schemas/Uuid'
                    -
                      type: 'null'
                  description: '`null` or omitted for all inboxes.'
                channel_types:
                  oneOf:
                    -
                      type: array
                      minItems: 1
                      items:
                        type: string
                    -
                      type: 'null'
                  description: '`null` or omitted for all channel types, for example `["android_sim"]`.'
                abilities:
                  oneOf:
                    -
                      type: array
                      minItems: 1
                      items:
                        type: string
                    -
                      type: 'null'
                allowed_ips:
                  oneOf:
                    -
                      type: array
                      minItems: 1
                      maxItems: 20
                      items:
                        type: string
                        maxLength: 49
                        description: 'An IPv4 or IPv6 address, or a CIDR range.'
                    -
                      type: 'null'
                  description: 'IPv4/IPv6 addresses or CIDR ranges.'
                expires_at:
                  type:

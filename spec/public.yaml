      required:
        - active
        - day
        - ends_at
        - today_cap
      properties:
        active:
          type: boolean
        day:
          type: integer
        ends_at:
          oneOf:
            -
              $ref: '#/components/schemas/Timestamp'
            -
              type: 'null'
        today_cap:
          type:
            - integer
            - 'null'
    ChannelHealth:
      type: object
      description: 'The SIM safety score.'
      required:
        - score
        - band
        - evaluated_at
        - quarantine_until
        - components
      properties:
        score:
          type:
            - integer
            - 'null'
          description: '0 to 100; `null` until the first evaluation.'
        band:
          type:
            - string
            - 'null'
          enum:
            - good
            - fair
            - poor
            - critical
            - null
        evaluated_at:
          oneOf:
            -
              $ref: '#/components/schemas/Timestamp'
            -
              type: 'null'
        quarantine_until:
          description: 'Set while the channel is quarantined.'
          oneOf:
            -
              $ref: '#/components/schemas/Timestamp'
            -
              type: 'null'
        components:
          type: object
          description: "The inputs of the last evaluation under the keys the evaluation stored (failure rate, delivery-report\nrate, opt-out rate, reply ratio, consecutive failures, carrier barring, carrier notice, delivery-report\nsilence, canary, new-recipient share, human activity and incident memory); `{}` before the first one.\n"
          additionalProperties: true
    ChannelQueue:
      type: object
      description: 'Outbound messages waiting on the channel.'
      required:
        - queued
        - held
        - leased
      properties:
        queued:
          type: integer
          description: 'Queued and sendable now.'
        held:
          type: integer
          description: 'Queued with a `send_after` still ahead.'
        leased:
          type: integer
          description: 'Handed to the phone and not yet reported.'
    ChannelUsage:
      type: object
      description: 'Sent segments in rolling windows.'
      required:
        - segments_15m
        - segments_1h
        - segments_24h
      properties:
        segments_15m:
          type: integer
        segments_1h:
          type: integer
        segments_24h:
          type: integer
    ChannelVerification:
      type: object
      description: 'The latest verification of the number.'
      required:
        - id

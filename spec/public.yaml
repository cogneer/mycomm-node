paths:
  /account:
    get:
      operationId: getAccount
      tags:
        - Account
      summary: 'Get the account'
      description: "The account the key belongs to. Needs no ability and also works for a\nsuspended account. `settings` is `accounts.settings` without `notifications` and\n`onboarding`, which concern portal users only.\n"
      responses:
        200:
          description: 'The account.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        -
          $ref: '#/components/parameters/MyCommAccount'
      x-codeSamples:
        -
          lang: Shell
          label: curl
          source: "curl -X GET \"$MYCOMM_URL/v1/account\" \\\n  -H \"Authorization: Bearer $MYCOMM_API_KEY\""
    patch:
      operationId: updateAccount
      tags:
        - Account
      summary: 'Update the account'
      description: "Requires `account:write`. `settings` is deep-merged: arrays are replaced whole, language\nmaps merge key by key and `null` removes a language. `settings.limits` is read-only for\naccount keys (`422 VALIDATION_FAILED`). Changes are audit-logged.\n"
      requestBody:
        required: true
        content:

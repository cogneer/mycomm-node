          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        -
          name: q
          in: query
          description: 'Full-text search on the body, at least 2 characters.'
          schema:
            type: string
            minLength: 2
        -
          name: created_after
          in: query
          description: 'Inclusive lower bound.'
          schema:
            $ref: '#/components/schemas/Timestamp'
        -
          name: created_before
          in: query
          description: 'Exclusive upper bound.'
          schema:

    MessageDirection:
      type: string
      description: '`outbound` is a message you or an automation sent; `inbound` is one the contact sent. The values are generated from the platform; a new one may appear.'
      enum:
        - outbound
        - inbound
    MessageType:
      type: string
      description: 'How the message travels. `sms` and `mms` are the SMS channel; the others belong to channels that are not available yet. The values are generated from the platform; a new one may appear.'
      enum:
        - sms
        - mms
        - whatsapp
        - telegram
    MessageOrigin:
      type: string
      description: 'Where the message came from: `api` is your request, `portal` a person using the portal, `campaign` and `automation` the features of those names, `phone` a message typed on the phone, `import` a phone-history import, `system` MyComm itself, `canary` a delivery check. A new value may appear.'
      enum:
        - portal
        - api
        - campaign
        - automation
        - phone
        - import
        - system
        - canary
    MessageContentType:
      type: string
      description: 'The kind of content in `content`. `text` and `media` are what the SMS channel sends; the rest belong to other channels. A new value may appear.'
      enum:
        - text
        - media
        - interactive
        - location
        - reaction
        - channel_template
        - unsupported
    MessageCategory:
      type: string
      description: '`transactional` for messages the contact expects (codes, receipts); `marketing` for promotions, which are held outside bulk hours and checked against opt-outs.'
      enum:
        - transactional
        - marketing
    MessageLane:
      type: string
      description: 'The sending priority: `high` goes first, `normal` is the default, `bulk` waits for quiet capacity and requires a `category`.'
      enum:

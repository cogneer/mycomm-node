      summary: 'Create an automation rule'
      description: "Requires `automation:write`, which a key restricted to inboxes never holds (`403 ABILITY_MISSING`). A keyword\nrule goes to the end of the inbox's keyword rules unless `position` (1 to the number of keyword rules plus\none) says otherwise; an `away` rule has no `match`, sits at position 0 and fires outside the inbox's business\nhours. An inbox holds at most 200 keyword rules and one away rule: a second one is `409 INVALID_STATE`.\n`422 TEMPLATE_ARCHIVED` and `LINK_PUBLIC_SHORTENER` (`details.url`) come from the `reply` actions;\n`422 VALIDATION_FAILED` covers every field, an unknown group or template (also one of another account), a\nreserved opt-out or opt-in keyword, and any field that is not listed here. Strings, lists and objects have\ntheir size limits checked first, so oversized values are `422`, never an error. The body is JSON, at most\n128 KB (`413 PAYLOAD_TOO_LARGE`, `details.max_bytes`); anything else is `400 MALFORMED_REQUEST`.\n"

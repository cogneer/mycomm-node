    post:
      operationId: replyToConversation
      tags:
        - Conversations
      summary: 'Reply in a conversation'
      description: "Sends a message in the thread. Requires `conversations:write` and `messages:send`. The body is the\nbody of `POST /v1/messages` without `to`, `contact_id`, `inbox_id`, `channel_id`, `from` and `channel_type`; the\ninbox and contact identity of the conversation are used. Sending one of those fields answers\n`422 VALIDATION_FAILED` with the field in `details.fields`.\n\nEverything else behaves as on `POST /v1/messages`: `202` with the message resource plus `warnings[]`, `dry_run`,\n`Idempotency-Key`, `reference_id` (`409 REFERENCE_ID_EXISTS`) and the `422` acceptance rejections of `POST /v1/messages`.\nA conversation outside the key's inbox scope answers 404.\n"
      parameters:

        - slug
        - target_url
        - message_id
        - campaign_id
        - contact_id
        - clicked_at
        - country_iso
        - click_count
      properties:
        short_link_id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type:
            - string
            - 'null'
          example: x7Kp2Qa
        target_url:
          type:
            - string
            - 'null'
          example: 'https://erp.example.com/pay/1094827'
        message_id:
          oneOf:
            -
              $ref: '#/components/schemas/Uuid'
            -
              type: 'null'
          description: 'The message that carried the link; `null` for a link not made for a message.'
        campaign_id:
          oneOf:
            -

    SendBatchItem:
      description: "An item of a batch: the sender, recipient, content and option fields of `SendMessageRequest`, without `dry_run`\n(the batch has its own). Fields the item omits come from `defaults`; the rules of `SendMessageRequest` (a\nrecipient, some content, `category` on the bulk lane) apply to the item after the defaults are merged in. A batch\nitem always needs a `category`, in the item or in `defaults`.\n"
      type: object
      allOf:

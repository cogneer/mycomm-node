    patch:
      operationId: updateContact
      tags:
        - Contacts
      summary: 'Update a contact'
      description: "Requires `contacts:write`. Top-level fields replace the stored value (`null` empties it); `custom_fields` merges\nkey by key (`null` removes a key); `group_ids` replaces the memberships when sent. Identities have their own\nendpoints. Emits `contact.updated` when something changed.\n"

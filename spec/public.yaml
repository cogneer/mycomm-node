info:
  title: 'MyComm API'
  version: 1.0.0
  contact:
    name: 'MyComm developer support'
    url: 'https://mycomm.cogneer.tech/docs'
  description: "Send and receive messages through the phones and accounts you connect to MyComm: SMS through your own SIMs today,\nmore channels later. Everything is JSON over HTTPS under `/v1`.\n\n## Authentication\n\nCreate an API key in the portal (Developers, API keys) and send it as `Authorization: Bearer mc_live_...`. Keep it on\nyour server: the API has no CORS and a key in a browser is a leaked key. A key has abilities (`messages:send`,\n`contacts:write`, ...) and may be limited to some inboxes and some IP addresses. A partner key acts on a client account\nwith the `MyComm-Account` header.\n\nA key is 54 characters (`mc_live_`) or 57 (`mc_partner_`); the last six are a checksum, so a mistyped key is refused\nat once with `401 UNAUTHENTICATED` and `details.reason: \"malformed_key\"`.\n\n## Conventions\n\n- Requests and responses are JSON, UTF-8, `snake_case`. Send `Content-Type: application/json`; the two upload\n  endpoints (`POST /v1/media`, `POST /v1/imports` with a CSV) take `multipart/form-data`. A request without a body\n  (pause, archive, cancel, ...) sends nothing and needs no `Content-Type`. Bodies over 1 MB answer `413`.\n- Ids are UUIDv7 strings, timestamps RFC 3339 in UTC, absent optional values `null`.\n- Lists are `{\"data\": [...], \"next_cursor\": \"...\" | null}`; pass `next_cursor` back as `cursor`.\n- Send `Idempotency-Key` (1 to 255 printable ASCII characters, a UUID is best) on a POST you may retry. A repeat within\n  24 hours returns the first response with `Idempotent-Replayed: true`; the same key on a different request answers\n  `409 IDEMPOTENCY_KEY_REUSED`.\n- Clients must ignore unknown response fields, unknown enum values and unknown error codes: the API only adds to\n  them within `v1`. Unknown request fields are ignored too.\n\n## Required fields\n\nEvery request schema lists its `required` fields. A rule that depends on other fields is written as JSON Schema\n(`oneOf`, `anyOf`, `dependentRequired`, `if`/`then`) and repeated in plain words in `x-required-when`, a list of\n`{field, when | rule, error}` entries: for example `category` is required when `lane` is `bulk`, and exactly one of\n`to` or `contact_id` is needed. The `error` names the code the API answers when the rule is broken.\n\n## Errors\n\nEvery non-2xx response is `{\"error\": {\"code\", \"message\", \"details\", \"request_id\", \"doc_url\"}}`. Branch on `code`,\nshow `message` to people, log `request_id`, and follow `doc_url` for what the code means and what to do. The\nstatus follows one rule: 400 the request cannot be read or a header is wrong, 401 no usable key, 403 the key may not,\n404 the resource is not yours or does not exist, 409 a conflict with current state, 413 too large, 415 wrong content\ntype, 422 well-formed but not acceptable (invalid fields, or a rule such as an opt-out), 429 slow down, 5xx retry.\n`422 VALIDATION_FAILED` lists every broken field in `details.fields`, each with all the rules it broke.\n\n## Verify your integration\n\n1. `GET /v1/account` with your key proves authentication and returns the account you are acting on.\n2. `POST /v1/messages` with `\"dry_run\": true` runs authentication, the key's abilities, request validation, sender and\n   recipient resolution, content checks, opt-outs and the safety rules, and answers `200` with the message it would\n   create. It stores, queues and sends nothing and does not use up the `Idempotency-Key`. It does not check that the\n   phone is online or that the carrier delivers.\n3. Send a real message to your own number and watch it move through `queued`, `sent` and `delivered`\n   (`GET /v1/messages/{id}`, or the `message.*` webhook events).\n\n## SDKs\n\n- PHP: `composer require mycomm/mycomm-php`\n- Laravel: `composer require mycomm/mycomm-laravel`\n- Connect widget (pair a phone from your own page): `npm install @mycomm/connect`\n"

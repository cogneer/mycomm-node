  '/webhook-endpoints/{id}/rotate-secret':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: rotateWebhookEndpointSecret
      tags:
        - Webhooks
      summary: "Rotate a webhook endpoint's secret"
      description: "Requires `webhooks:write`. The old secret stays valid as the previous secret for\n`previous_secret_valid_seconds` (0 to 86400, default 86400); during the overlap every delivery carries\nboth signatures. Rotating again replaces the previous secret.\n"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                previous_secret_valid_seconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
      responses:
        200:
          description: 'The new secret, shown once.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret
                  - previous_secret_expires_at
                properties:
                  secret:
                    type: string
                  previous_secret_expires_at:
                    $ref: '#/components/schemas/Timestamp'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        413:
          $ref: '#/components/responses/PayloadTooLarge'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
        -
          $ref: '#/components/parameters/MyCommAccount'

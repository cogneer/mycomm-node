            -
              type: 'null'
        clicked_at:
          $ref: '#/components/schemas/Timestamp'
        country_iso:
          type:
            - string
            - 'null'
          pattern: '^[A-Z]{2}$'
          description: 'ISO 3166-1 alpha-2 country of the click, when known.'
          example: PK
        click_count:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 'Human clicks on the link so far, this one included.'

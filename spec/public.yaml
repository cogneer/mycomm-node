    SendMessageAddressing:
      type: object
      description: 'Who sends and who receives. Part of `SendMessageRequest` and of each batch item.'
      properties:
        inbox_id:
          $ref: '#/components/schemas/Uuid'
          description: 'The inbox to send from. A key limited to one inbox may leave all sender fields out.'
        channel_id:
          $ref: '#/components/schemas/Uuid'
          description: "Send from this channel's main inbox."
        from:
          type: string
          description: "A channel address (for SMS, the number); resolves to that channel's main inbox."
        channel_type:
          type: string
          description: 'Only to choose between channels of different types that share the `from` address.'
        to:
          type: string
          description: "Recipient address in the channel's format (a phone number in any accepted format for SMS). Not together with `contact_id`."
        contact_id:
          $ref: '#/components/schemas/Uuid'
          description: "Send to this contact's address for the channel. Not together with `to`."
    SendMessageContentFields:
      type: object
      description: 'What to say. The full form is `content`; `body`, `media_ids` and `template_id` are the shorthand.'
      properties:
        content:
          type: object
          description: 'The full content form. `type` is `text`, `media`, `template` or a channel-specific type refused with `CHANNEL_CAPABILITY_UNSUPPORTED`. Excludes `body`, `media_ids`, `template_id` and `variables`.'
          additionalProperties: true
        body:
          type: string
          description: 'Shorthand for text content. May go with `media_ids`.'
        media_ids:
          type: array
          description: 'Shorthand for media content: ids from `POST /v1/media`. One item today.'
          items:
            $ref: '#/components/schemas/Uuid'
        template_id:
          $ref: '#/components/schemas/Uuid'
          description: 'Shorthand for template content.'
        variables:
          type: object
          description: "Values for the template's variables. Needs `template_id`."
          additionalProperties: true
        channel_options:
          type: object
          description: 'Options only some channels understand; ignored with a warning elsewhere.'
          additionalProperties: true
        smart_replace:
          type: boolean
          description: 'Replace characters that force UCS-2 encoding with plain look-alikes where it saves segments.'
    SendMessageOptionFields:
      type: object
      description: 'Priority, timing, tracking and your own ids.'
      properties:
        category:
          type: string
          enum:
            - transactional
            - marketing
          x-enum-descriptions:
            transactional: 'Expected by the recipient (codes, receipts, replies).'
            marketing: 'Promotion. Refused for recipients who opted out and in countries that block it.'
          description: 'Required when `lane` is `bulk` (`CATEGORY_REQUIRED`).'
        lane:
          type: string
          enum:
            - high
            - normal
            - bulk
          description: 'How urgently the message is sent. `bulk` is paced behind other traffic and needs `category`.'
          x-enum-descriptions:
            high: 'Sent first; for codes and alerts.'
            normal: 'The default.'
            bulk: 'Paced behind other traffic; needs `category`.'
        send_after:
          type: string
          format: date-time
          description: 'At most 30 days ahead (`SEND_AFTER_TOO_FAR`). A time in the past means now.'
        expires_in:
          type: integer
          minimum: 60
          maximum: 604800
          description: 'Seconds after which an unsent message is dropped, 60 to 604800 (7 days).'
        reference_id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^\S+$
          description: 'Your own id for this message, 1 to 100 characters without spaces. Unique per account forever (`REFERENCE_ID_EXISTS`).'
        metadata:
          type: object
          maxProperties: 50
          x-max-json-bytes: 2048
          description: 'Up to 50 keys, 2 KB as JSON, scalar values only. Returned on the message and in webhooks.'
          additionalProperties:
            type:
              - string
              - number
              - boolean
              - 'null'
        shorten_links:
          type: boolean
          description: 'Replace each URL with a short link so clicks are counted.'
    SendMessageRequest:
      type: object
      allOf:
        -
          $ref: '#/components/schemas/SendMessageAddressing'
        -
          $ref: '#/components/schemas/SendMessageContentFields'
        -
          $ref: '#/components/schemas/SendMessageOptionFields'
      description: "The body of `POST /v1/messages`. Three things are always needed: who sends (see the sender fields), who receives\n(`to` or `contact_id`, not both) and what to say (`content`, or one of the shorthand fields `body`, `media_ids`,\n`template_id`). Unknown fields are ignored.\n"
      anyOf:
        -
          required:
            - content
        -
          required:
            - body
        -
          required:
            - media_ids
        -
          required:
            - template_id
      oneOf:
        -
          required:
            - to
        -
          required:
            - contact_id
      dependentRequired:
        variables:
          - template_id
      if:
        required:
          - lane
        properties:
          lane:
            const: bulk
      then:
        required:
          - category
      x-required-when:
        -
          field: 'to | contact_id'
          rule: exactly_one
          error: VALIDATION_FAILED
          note: 'Send a phone number or address in `to`, or the id of a contact in `contact_id`.'
        -
          field: 'content | body | media_ids | template_id'
          rule: at_least_one
          error: VALIDATION_FAILED
          note: '`content` is the full form; `body` and `media_ids` are the shorthand for text and image messages. `content` excludes the shorthand fields (`CONTENT_CONFLICT`).'
        -
          field: category
          when: 'lane is bulk'
          error: CATEGORY_REQUIRED
        -
          field: 'inbox_id | channel_id | from'
          when: 'the key is not limited to one inbox'
          rule: at_most_one_then_one_resolves
          error: CHANNEL_REQUIRED
          note: 'Name the sender with one of `inbox_id`, `channel_id` or `from`. `channel_type` only disambiguates `from` (`FROM_AMBIGUOUS`). Fields that point at different inboxes answer `CHANNEL_INBOX_MISMATCH`.'
        -
          field: variables
          when: 'template_id is sent'
          rule: requires_template_id
          error: VALIDATION_FAILED
      properties:
        dry_run:
          type: boolean
          default: false
          description: 'Validate, render and compute segments and holds without creating anything (answers `200`).'
    SendMessageDryRunResponse:
      description: 'The would-be message of a dry run. `id`, `status`, `conversation_id` and the timestamps are `null`.'
      type: object
      required:

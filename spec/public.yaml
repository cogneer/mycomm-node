      summary: 'Create a connect session'
      description: "Requires `channels:write`. Send your tenant's browser to `url` to connect a phone on\nMyComm's hosted page without an API key in the browser. Works with an account key and with a partner key\nacting as a managed account (`MyComm-Account`). `url` is returned only here and is a bearer credential:\ntreat it like a password. At most 20 sessions are open per account (`422 CONNECT_SESSION_LIMIT_REACHED`\nwith `details.max`) and 60 are created per account per hour (`429 RATE_LIMITED`).\n"

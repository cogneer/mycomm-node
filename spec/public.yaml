          in: query
          description: '`open` (default), `archived` or `all`.'
          schema:
            type: string
            enum:
              - open
              - archived
              - all
            default: open
        -
          name: unread
          in: query
          description: '`true` = `unread_count > 0`, `false` = read only.'
          schema:
            type: boolean
        -
          name: blocked
          in: query
          description: '`true` = the identity is blocked, `false` = not blocked.'

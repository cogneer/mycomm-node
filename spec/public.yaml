      description: "Requires `reports:read`. Counters per calendar day in the account time zone, from\n`usage_daily`. `from` and `to` are inclusive and span at most 366 days (`422 RANGE_TOO_LARGE`, details\n`{max_days: 366}`). With `group_by=none` every day is present, zeros included, and the response is not\npaginated. Grouped results contain rows only where there was traffic, ordered by `date` then the group key,\nand are paginated with `cursor`. A key restricted to inboxes sees its inboxes only and may group by `none` or\n`inbox`; other values give `VALIDATION_FAILED`.\n"
      parameters:
        -
          name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        -
          name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        -
          name: channel_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: inbox_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: channel_type
          in: query
          schema:
            type: string
            enum:
              - android_sim
              - whatsapp_evolution
              - telegram_bot
        -
          name: group_by
          in: query
          description: 'Default `none`.'
          schema:
            type: string
            enum:
              - none
              - channel
              - inbox
              - channel_type
        -
          name: limit
          in: query
          description: 'Grouped results only. 1 to 1,000 rows, default 200.'
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        -
          $ref: '#/components/parameters/cursor'
        -
          $ref: '#/components/parameters/MyCommAccount'
      responses:
        200:
          description: 'Daily counters.'

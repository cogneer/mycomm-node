  /contacts/bulk:
    post:
      operationId: bulkUpsertContacts
      tags:
        - Contacts
      summary: 'Upsert up to 1,000 contacts'
      description: "Requires `contacts:write`. Each item has the shape of `PUT /v1/contacts/by-identity` and is\nprocessed independently, in order; the top-level `add_to_group_ids` is added for every item, together with the\nitem's own. The answer is always `200` with a `summary` and one `results[]` entry per item, also when every item\nwas rejected. A rejected item carries the error code the single upsert would answer (`INVALID_NUMBER`,\n`IDENTITY_TYPE_UNAVAILABLE`, `VALIDATION_FAILED`) and writes nothing.\n\nEnvelope problems answer `422` and nothing is processed: `BATCH_TOO_LARGE` (`details.max`, 1,000) or\n`VALIDATION_FAILED`. Larger sets go through a CSV import. `Idempotency-Key` covers the whole call.\n"
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
        -
          $ref: '#/components/parameters/MyCommAccount'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactBulkRequest'
      responses:
        200:
          description: 'Per-item results and a summary, also when every item was rejected.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Idempotent-Replayed:

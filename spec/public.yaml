      description: "Requires `channels:write`. Retries the verification of a `pending_verification` channel: a\nnew attempt after a failed one, or a new verification after a `failed` or `expired` one, optionally with a\ncorrected `address`. An attempt that is still running is left as it is. It also re-verifies a channel paused with\n`auto:sim_missing` on the SIM now in its phone; the channel keeps its number and stays paused until the\nverification succeeds. A channel in any other state is `409 INVALID_STATE`. The checks are those of connect.\n`422 VERIFICATION_LIMIT_REACHED` says in `retry_after_seconds` when to try again.\n"
      parameters:

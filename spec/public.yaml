      description: 'Why a queued message is waiting: the schedule (`scheduled`, `quiet_hours`, `bulk_hours`), a limit (`frequency_cap`, `content_cap`, `recipient_cap`, `new_recipient_cap`, `account_limit`, `carrier_cooldown`), the phone (`device_offline`, `device_paused`, `device_hot`), the channel or campaign being paused (`channel_paused`, `campaign_paused`), a file still being processed (`media_processing`), a link needing approval (`link_restricted`) or a platform hold (`platform_hold`). A new value may appear.'
      enum:
        - scheduled
        - quiet_hours
        - frequency_cap
        - channel_paused
        - device_offline
        - device_paused
        - campaign_paused
        - media_processing
        - content_cap
        - recipient_cap
        - new_recipient_cap
        - link_restricted
        - platform_hold
        - account_limit
        - bulk_hours
        - carrier_cooldown
        - device_hot
    MessageEventName:

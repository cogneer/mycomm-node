      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        reply_window_days:
          type: integer
          minimum: 1
          maximum: 365
        allowed_destination_countries:
          description: "`null` is the channel's own country only; a list must contain the channel's own country."
          oneOf:
            -
              type: array
              minItems: 1
              items:
                type: string
                pattern: '^[A-Za-z]{2}$'
            -
              type: 'null'
        skip_business_senders:
          type: boolean
    ChannelActionErrorInvalidState:
      description: "`409 INVALID_STATE`: the channel's status or pause reason does not allow this action."
      allOf:
        -
          $ref: '#/components/schemas/Error'
        -
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - INVALID_STATE
                details:
                  type: object
                  required:
                    - status
                  properties:
                    status:
                      type: string
                      enum:
                        - pending_verification
                        - active
                        - paused
                        - disconnected
                    allowed_from:
                      type: array
                      description: 'The statuses the action accepts.'
                      items:
                        type: string
                        enum:
                          - pending_verification
                          - active
                          - paused
                          - disconnected
    ChannelActionErrorIdempotency:
      description: '`409 IDEMPOTENCY_KEY_REUSED`: the `Idempotency-Key` was used with a different request.'
      allOf:
        -
          $ref: '#/components/schemas/Error'
        -
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - IDEMPOTENCY_KEY_REUSED
    ChannelConnectErrorGeneric:
      description: 'A connect or verify refusal that carries no details of its own.'
      allOf:
        -
          $ref: '#/components/schemas/Error'
        -
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - CHANNEL_ADDRESS_IN_USE
                    - ADDRESS_REQUIRED
                    - SIM_NOT_PRESENT
                    - DEVICE_NOT_ACTIVE
                    - ACCOUNT_THROTTLED
    ChannelConnectErrorDeviceSimLimit:
      description: '`422 DEVICE_SIM_LIMIT`: connecting a further SIM on a phone that breaks the UK SIM-farm rule. `details.reason` says which rule fired and `details.sims_30_days` is the number of SIMs the phone showed in the last 30 days.'
      allOf:
        -
          $ref: '#/components/schemas/Error'
        -
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - DEVICE_SIM_LIMIT
                details:
                  type: object
                  required:
                    - reason
                    - sims_30_days
                  properties:
                    reason:
                      type: string
                      enum:
                        - DEVICE_SIM_LIMIT
                        - DEVICE_SIM_LIMIT_AT_ONCE
                      description: '`DEVICE_SIM_LIMIT` when the phone showed 5 or more SIMs in 30 days (also when the at-once rule holds too); `DEVICE_SIM_LIMIT_AT_ONCE` when only the at-once rule fired (more than 2 SIMs present together). A detail value, not an error code: `error.code` is `DEVICE_SIM_LIMIT` in both cases.'
                    sims_30_days:
                      type: integer
                      minimum: 1
                      description: 'SIMs the phone has had present or seen in the last 30 days. 5 or more when `reason` is `DEVICE_SIM_LIMIT`.'
    ChannelConnectErrorSimAlreadyConnected:
      description: '`409 SIM_ALREADY_CONNECTED`: the SIM already backs a pending, active or paused channel of the account. `details.channel_id` names that channel; a restricted key whose scope does not include it gets no `channel_id`.'
      allOf:
        -
          $ref: '#/components/schemas/Error'
        -
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - SIM_ALREADY_CONNECTED
                details:
                  type: object
                  description: "`channel_id` is left out when the channel is outside the key's scope."
                  properties:
                    channel_id:
                      $ref: '#/components/schemas/Uuid'
    ChannelConnectErrorInvalidState:
      description: '`409 INVALID_STATE`: only a channel waiting for verification, or paused with `auto:sim_missing`, can be verified.'
      allOf:
        -
          $ref: '#/components/schemas/Error'
        -
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - INVALID_STATE
                details:
                  type: object
                  required:
                    - status
                  properties:
                    status:
                      type: string
                      enum:
                        - pending_verification
                        - active
                        - paused
                        - disconnected
                    allowed_from:
                      type: array
                      items:
                        type: string
                        enum:
                          - pending_verification
                          - active
                          - paused
                          - disconnected
    ChannelConnectErrorInvalidNumber:
      description: '`422 INVALID_NUMBER`: not a valid mobile number.'
      allOf:
        -
          $ref: '#/components/schemas/Error'
        -
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - INVALID_NUMBER
                details:
                  type: object
                  required:
                    - input
                  properties:
                    input:
                      type: string
    ChannelConnectErrorCountryNotEnabled:
      description: "`422 COUNTRY_NOT_ENABLED`: the number's country preset is disabled."
      allOf:
        -
          $ref: '#/components/schemas/Error'
        -
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - COUNTRY_NOT_ENABLED
                details:
                  type: object
                  required:
                    - country_iso
                  properties:
                    country_iso:
                      type: string
                      description: "ISO 3166-1 alpha-2 code of the number's country."
    ChannelConnectErrorVerificationLimit:
      description: '`422 VERIFICATION_LIMIT_REACHED`: more than 3 attempts per channel per hour, 10 per account per day, or less than 10 minutes after a failed verification.'
      allOf:
        -
          $ref: '#/components/schemas/Error'
        -
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - VERIFICATION_LIMIT_REACHED
                details:
                  type: object
                  required:
                    - retry_after_seconds
                  properties:
                    retry_after_seconds:
                      type: integer
                      minimum: 1
    ChannelConnectErrorTypeNotAllowed:
      description: "`422 CHANNEL_TYPE_NOT_ALLOWED`: the channel type is not enabled (v1: push channels), or `android_sim` is not in the account's `settings.channels.allowed_types`."
      allOf:
        -
          $ref: '#/components/schemas/Error'
        -
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - CHANNEL_TYPE_NOT_ALLOWED
                details:
                  type: object
                  properties:
                    type:
                      type: string
    ChannelRatePolicyUpdate:
      type: object
      description: "The policy keys to change and the acknowledgement, or `reset_to_suggested`. `schema` and\n`acknowledged_risk_at` are set by the server and ignored when sent.\n"
      if:
        properties:
          reset_to_suggested:
            const: true
        required:
          - reset_to_suggested
      then:
        not:
          anyOf:
            -
              required:
                - caps
            -
              required:
                - interval_ms
            -
              required:
                - warmup
            -
              required:
                - active_hours
            -
              required:
                - bulk_hours
      x-required-when:
        -
          field: 'caps | interval_ms | warmup | active_hours | bulk_hours'
          when: 'reset_to_suggested is true'
          rule: none_allowed
          error: VALIDATION_FAILED
          note: 'A reset restores the suggested policy; send the policy keys in a separate request.'
      properties:
        caps:
          type: object
          properties:
            per_min:
              type: integer
              minimum: 1
            per_15m:
              type: integer
              minimum: 1
            per_hour:
              type: integer
              minimum: 1
            per_day:
              type: integer
              minimum: 1
            new_recipients_per_day:
              type:
                - integer
                - 'null'
              minimum: 1
              description: "May be set lower than the country preset's value, never higher (`reason: country`)."
        interval_ms:
          type: object
          properties:
            min:
              type: integer
              minimum: 1
            max:
              type: integer
              maximum: 600000
        warmup:
          type: object
          properties:
            enabled:
              type: boolean
        active_hours:
          type:
            - object
            - 'null'
          description: "The owner's sending window; `null` means any time. `timezone` `null` is the account time zone."
          required:
            - start
            - end
          properties:
            start:
              type: string
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
            end:
              type: string
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
            timezone:
              type:
                - string
                - 'null'
        bulk_hours:
          type:
            - object
            - 'null'
          description: "The window of the `bulk` lane within 07:00 to 22:00 sender-local. `tz` `null` is the channel country's time zone."
          required:
            - start
            - end
          properties:
            start:
              type: string
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
            end:
              type: string
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
            tz:
              type:
                - string
                - 'null'
        acknowledge_risk:
          type: boolean
          description: 'Required to save an `amber` or `red` policy, again whenever the risk rises above the acknowledged level.'
        reset_to_suggested:
          type: boolean
          description: '`true` restores the suggestion and clears the acknowledgement; not allowed together with policy fields.'
    ChannelRatePolicyErrorAboveCeiling:
      description: "`422 ABOVE_PLATFORM_CEILING`: a cap above what this channel may be set to now, or a wait shorter than the suggestion's during the first 14 days of the account."
      allOf:
        -
          $ref: '#/components/schemas/Error'
        -
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - ABOVE_PLATFORM_CEILING
                details:
                  type: object
                  required:
                    - field
                    - value
                    - ceiling
                    - reason
                  properties:
                    field:
                      type: string
                      description: 'The policy field path, for example `caps.per_15m`, `interval_ms.min` or `interval_ms.max`.'
                    value:
                      type: integer
                      description: 'The value that was sent, or that the merge produced. A wait in milliseconds for `interval_ms.min` and `interval_ms.max`.'
                    ceiling:
                      type: integer
                      description: 'The most this field may be set to for this channel now. For `interval_ms.min` and `interval_ms.max` (reason `new_account`) it is the shortest wait allowed, in milliseconds.'
                    reason:
                      type: string
                      enum:
                        - platform
                        - country
                        - override_limit
                        - new_account
                        - restricted_country
    ChannelRatePolicyErrorRiskAcknowledgement:
      description: '`422 RISK_ACKNOWLEDGEMENT_REQUIRED`: an `amber` or `red` policy without `acknowledge_risk: true`.'
      allOf:
        -
          $ref: '#/components/schemas/Error'
        -
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - RISK_ACKNOWLEDGEMENT_REQUIRED
                details:
                  type: object
                  required:
                    - risk
                    - exceeds
                  properties:
                    risk:
                      type: string
                      enum:
                        - amber
                        - red
                    exceeds:
                      type: object
                      description: 'Each value above the suggestion, by field path, with what was asked and what is suggested.'
                      additionalProperties:
                        type: object
                        required:
                          - requested
                          - suggested
                        properties:
                          requested: {}
                          suggested: {}
    ChannelTypeInfo:
      type: object
      description: 'One channel type and its static shape.'
      required:
        - type
        - label
        - available
        - connect_methods
        - identity_types
        - address_format
        - capabilities
        - content_types
        - delivery_states
      properties:
        type:
          type: string
          enum:
            - android_sim
            - whatsapp_evolution
            - telegram_bot
        label:
          type: string
        available:
          type: boolean
          description: 'Enabled on the platform and allowed by `settings.channels.allowed_types`.'
        available_from:
          type: string
          description: 'The release a type that has not shipped yet arrives in (`v2`, `v2.1`); absent once shipped.'
        connect_methods:
          type: array
          items:
            type: string
            enum:
              - device_pairing
              - qr_scan
              - pairing_code
              - bot_token
        identity_types:
          type: array
          description: 'Identity types this type sends to, in preference order.'
          items:
            type: string
        address_format:
          type: string
          enum:
            - e164
            - telegram_user_id
        capabilities:
          $ref: '#/components/schemas/ChannelTypeCapabilities'
        content_types:
          type: array
          items:
            type: string
            enum:
              - text
              - media
              - template
              - interactive
              - location
              - reaction
        delivery_states:
          type: array
          items:
            type: string
            enum:
              - sent
              - delivered
              - read
    ChannelTypeCapabilities:
      type: object
      description: "The type's static capabilities; a channel's resolved capabilities may differ."
      required:
        - text_max_chars
        - segmented
        - max_segments
        - media
        - max_media_items
        - delivery_reports
        - read_receipts
        - typing
        - reactions
        - edit_delete
        - buttons
        - location
        - business_initiated
        - session_window_seconds
        - groups
      properties:
        text_max_chars:
          type:
            - integer
            - 'null'
          description: '`null` for segmented types (SMS).'
        segmented:
          type: boolean
        max_segments:
          type:
            - integer
            - 'null'
        media:
          type: object
          description: 'Media kind (`image`) to its limits.'
          additionalProperties:
            $ref: '#/components/schemas/ChannelMediaLimits'
        max_media_items:
          type: integer
        delivery_reports:
          description: '`per_channel` when it depends on what each channel learned (SMS); otherwise whether the type reports delivery.'
          oneOf:
            -
              type: boolean
            -
              type: string
              enum:
                - per_channel
        read_receipts:
          type: boolean
        typing:
          type: boolean
        reactions:
          type: boolean
        edit_delete:
          type: boolean
        buttons:
          type: boolean
        location:
          type: boolean
        business_initiated:
          type: boolean
        session_window_seconds:
          type:
            - integer
            - 'null'
        groups:
          type: boolean
    Channel:
      type: object
      description: 'A number (an `android_sim` channel in v1) with its full state.'
      required:
        - id
        - type
        - name
        - address
        - display_address
        - status
        - pause_reason
        - paused_at
        - disconnect_reason
        - device_id
        - device_sim_id
        - main_inbox_id
        - capabilities
        - allowed_destination_countries
        - skip_business_senders
        - rate_policy
        - rate_policy_source
        - rate_policy_risk
        - suggested_rate_policy
        - rate_policy_ceiling
        - warmup
        - health
        - queue
        - usage
        - reply_window_days
        - throttled_until
        - verification
        - verified_at
        - connected_at
        - disconnected_at
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum:
            - android_sim
            - whatsapp_evolution
            - telegram_bot
        name:
          type: string
        address:
          type: string
          description: 'The number in E.164 form. Empty while a channel connected without a number waits for the inbound probe to name it.'
        display_address:
          type:
            - string
            - 'null'
          description: 'The number formatted for display, for example `+92 300 1234567`.'
        status:
          type: string
          enum:
            - pending_verification
            - active
            - paused
            - disconnected
        pause_reason:
          type:
            - string
            - 'null'
          description: 'Set while `paused`.'
          enum:
            - owner
            - admin
            - account_suspended
            - 'auto:health_critical'
            - 'auto:quarantine'
            - 'auto:quota'
            - 'auto:sim_missing'
            - device_revoked
            - 'auto:failure_streak'
            - 'auto:session_lost'
            - 'auto:provider_banned'
            - 'auto:credentials_invalid'
            - null
        paused_at:
          description: 'When the current pause began.'
          oneOf:
            -
              $ref: '#/components/schemas/Timestamp'
            -
              type: 'null'
        disconnect_reason:
          type:
            - string
            - 'null'
          description: 'Set when `disconnected`.'
          enum:
            - owner
            - admin_force_release
            - account_deleted
            - declined_on_device
            - sim_retired
            - device_revoked
            - sim_removed
            - session_lost
            - provider_banned
            - credentials_invalid
            - null
        device_id:
          oneOf:
            -
              $ref: '#/components/schemas/Uuid'
            -
              type: 'null'
        device_sim_id:
          oneOf:
            -
              $ref: '#/components/schemas/Uuid'
            -
              type: 'null'
        main_inbox_id:
          description: "The channel's main inbox; `null` until the number is connected."
          oneOf:
            -
              $ref: '#/components/schemas/Uuid'
            -
              type: 'null'
        capabilities:
          $ref: '#/components/schemas/ChannelCapabilities'
        allowed_destination_countries:
          description: "ISO 3166-1 alpha-2 codes; `null` means the channel's own country only."
          oneOf:
            -
              type: array
              items:
                type: string
            -
              type: 'null'
        skip_business_senders:
          type: boolean
        rate_policy:
          $ref: '#/components/schemas/ChannelRatePolicy'
        rate_policy_source:
          type: string
          enum:
            - suggested
            - custom
        rate_policy_risk:
          type: string
          description: 'Risk of the stored policy against the suggestion.'
          enum:
            - green
            - amber
            - red
        suggested_rate_policy:
          $ref: '#/components/schemas/ChannelSuggestedRatePolicy'
        rate_policy_ceiling:
          $ref: '#/components/schemas/ChannelRatePolicyCeiling'
        warmup:
          $ref: '#/components/schemas/ChannelWarmup'
        health:
          $ref: '#/components/schemas/ChannelHealth'
        queue:
          $ref: '#/components/schemas/ChannelQueue'
        usage:
          $ref: '#/components/schemas/ChannelUsage'
        reply_window_days:
          type: integer
        throttled_until:
          description: 'Set when a push provider asked to slow down; always `null` for SMS.'
          oneOf:
            -
              $ref: '#/components/schemas/Timestamp'
            -
              type: 'null'
        verification:
          description: 'The latest verification of the number, or `null` before one exists.'
          oneOf:
            -
              $ref: '#/components/schemas/ChannelVerification'
            -
              type: 'null'
        verified_at:
          oneOf:
            -
              $ref: '#/components/schemas/Timestamp'
            -
              type: 'null'
        connected_at:
          oneOf:
            -
              $ref: '#/components/schemas/Timestamp'
            -
              type: 'null'
        disconnected_at:
          oneOf:
            -
              $ref: '#/components/schemas/Timestamp'
            -
              type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ChannelCapabilities:
      type: object
      description: "The resolved capabilities of the channel, the driver's defaults overlaid with what the channel learned."
      required:
        - text_max_chars
        - segmented
        - max_segments
        - media
        - max_media_items
        - delivery_reports
        - read_receipts
        - typing
        - reactions
        - edit_delete
        - buttons
        - location
        - business_initiated
        - session_window_seconds
        - groups
      properties:
        text_max_chars:
          type:
            - integer
            - 'null'
          description: '`null` for segmented channels (SMS).'
        segmented:
          type: boolean
        max_segments:
          type:
            - integer
            - 'null'
        media:
          type: object
          description: 'Media kind (`image`) to its limits; `{}` when the channel cannot send media.'
          additionalProperties:
            $ref: '#/components/schemas/ChannelMediaLimits'
        max_media_items:
          type: integer
        delivery_reports:
          type: boolean
        read_receipts:
          type: boolean
        typing:
          type: boolean
        reactions:
          type: boolean
        edit_delete:
          type: boolean
        buttons:
          type: boolean
        location:
          type: boolean
        business_initiated:
          type: boolean
        session_window_seconds:
          type:
            - integer
            - 'null'
        groups:
          type: boolean
    ChannelMediaLimits:
      type: object
      required:
        - max_bytes
        - mimes
      properties:
        max_bytes:
          type: integer
        mimes:
          type: array
          items:
            type: string
        target_bytes:
          type: integer
          description: "The size a larger file is re-encoded to (the phone's learned MMS limit)."
    ChannelRateCaps:
      type: object
      required:
        - per_min
        - per_15m
        - per_hour
        - per_day
        - new_recipients_per_day
      properties:
        per_min:
          type: integer
        per_15m:
          type: integer
        per_hour:
          type: integer
        per_day:
          type: integer
        new_recipients_per_day:
          type:
            - integer
            - 'null'
          description: "The country preset's value for `android_sim` (150 for PK) unless a custom policy sets a lower one."
    ChannelRatePolicy:
      type: object
      description: 'The stored rate policy with the preset recipient cap mirrored in.'
      required:
        - schema
        - interval_ms
        - caps
        - warmup
        - active_hours
        - bulk_hours
        - acknowledged_risk_at
      properties:
        schema:
          type: string
          description: '`sms_v1` for `android_sim`; read-only.'
        interval_ms:
          $ref: '#/components/schemas/ChannelRateInterval'
        caps:
          $ref: '#/components/schemas/ChannelRateCaps'
        warmup:
          $ref: '#/components/schemas/ChannelRateWarmup'
        active_hours:
          $ref: '#/components/schemas/ChannelActiveHours'
        bulk_hours:
          $ref: '#/components/schemas/ChannelBulkHours'
        acknowledged_risk_at:
          type:
            - string
            - 'null'
          format: date-time
    ChannelSuggestedRatePolicy:
      type: object
      description: "The platform's suggestion for this number; the policy without `acknowledged_risk_at`."
      required:
        - schema
        - interval_ms
        - caps
        - warmup
        - active_hours
        - bulk_hours
      properties:
        schema:
          type: string
        interval_ms:
          $ref: '#/components/schemas/ChannelRateInterval'
        caps:
          $ref: '#/components/schemas/ChannelRateCaps'
        warmup:
          $ref: '#/components/schemas/ChannelRateWarmup'
        active_hours:
          $ref: '#/components/schemas/ChannelActiveHours'
        bulk_hours:
          $ref: '#/components/schemas/ChannelBulkHours'
    ChannelRateInterval:
      type: object
      required:
        - min
        - max
      properties:
        min:
          type: integer
        max:
          type: integer
    ChannelRateWarmup:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    ChannelActiveHours:
      type:
        - object
        - 'null'
      description: 'The window in which the channel sends; `null` means any time.'
      properties:
        start:
          type: string
        end:
          type: string
        timezone:
          type:
            - string
            - 'null'
    ChannelBulkHours:
      type:
        - object
        - 'null'
      description: "The window in which the `bulk` lane may send; `tz` `null` means the channel country's time zone."
      properties:
        start:
          type: string
        end:
          type: string
        tz:
          type:
            - string
            - 'null'
    ChannelRatePolicyCeiling:
      type: object
      description: 'The most each cap may be set to for this channel now (`rate_policy_ceiling`).'
      required:
        - per_min
        - per_15m
        - per_hour
        - per_day
      properties:
        per_min:
          type: integer
        per_15m:
          type: integer
        per_hour:
          type: integer
        per_day:
          type: integer
    ChannelWarmup:
      type: object

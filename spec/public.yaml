        - normal
        - bulk
    MessageStatus:
      type: string
      description: 'Where an outbound message is: `queued` (accepted, may be held, see `hold_reason`), `leased` (a phone has it), `sent`, `delivered`, `read`, `failed` (see `failure`), `expired`, `cancelled`. An inbound message is `received`. A new value may appear.'
      enum:
        - queued
        - leased
        - sent
        - delivered
        - read
        - failed
        - expired
        - cancelled
        - received
    HoldReason:

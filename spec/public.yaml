  /messages:
    post:
      operationId: sendMessage
      tags:
        - Messages
      summary: 'Send one message'
      description: "Queues one message. Requires `messages:send`. The inbox decides the channel: give\n`inbox_id`, `channel_id` or `from` (the key's single inbox is used when it is restricted to exactly one).\nThe recipient is `to` or `contact_id`. The content is the `content` union or one of the shorthand fields\n(`body`, `media_ids`).\n\nAnswers `202` with the message resource (`status: queued`) plus `warnings[]` (empty when none; for example\n`CHANNEL_OPTIONS_IGNORED`). A message is accepted while the phone is offline or the channel is paused; it waits\nwith `hold_reason` `device_offline`, `device_paused` or `channel_paused`.\n\n`Idempotency-Key` replays the stored `202` for the same request. A `reference_id` already used by the account\nwithout a matching key answers `409 REFERENCE_ID_EXISTS` with `details.message_id` and the existing message in\n`details.message`; nothing is created. Every acceptance rejection answers `422` with its own code\n(`CATEGORY_REQUIRED`, `SEND_AFTER_TOO_FAR`, `INVALID_NUMBER`, `RECIPIENT_OPTED_OUT`, `CHANNEL_INACTIVE`, ...) and the\n`details` listed per code in the error reference. Shape errors (including `metadata` over 2 KB or 50 keys, or non-scalar values) answer\n`422 VALIDATION_FAILED` with `details.fields`. An inbox, channel or contact outside the key's scope answers 404.\n\nWith `dry_run: true` the same validation and acceptance errors apply, but nothing is stored,\nqueued or sent and the answer is `200` with the would-be message: `dry_run: true`, `id`, `conversation_id`,\n`status` and the timestamps `null`, `contact_id` `null` for a new number, and the computed `encoding`,\n`segments`, `type`, `hold_reason` and `expires_at`. `hold_reason` predicts compliance and scheduling holds only.\n`Idempotency-Key` and `reference_id` are checked but not consumed.\n"
      x-error-codes:
        - VALIDATION_FAILED
        - CHANNEL_REQUIRED
        - CHANNEL_INBOX_MISMATCH
        - FROM_AMBIGUOUS
        - CHANNEL_INACTIVE
        - INBOX_ARCHIVED
        - CHANNEL_CANNOT_INITIATE
        - NO_IDENTITY_FOR_CHANNEL
        - ADDRESS_REQUIRED
        - INVALID_NUMBER
        - INVALID_ADDRESS
        - NOT_MOBILE
        - DESTINATION_NOT_ALLOWED
        - COUNTRY_NOT_ENABLED
        - RECIPIENT_IS_CHANNEL
        - RECIPIENT_OPTED_OUT
        - CONTACT_BLOCKED
        - MARKETING_NOT_ALLOWED
        - CONSENT_PROVENANCE_MISSING
        - CATEGORY_REQUIRED
        - SEND_AFTER_TOO_FAR
        - CONTENT_CONFLICT
        - CHANNEL_CAPABILITY_UNSUPPORTED
        - BODY_EMPTY
        - BODY_TOO_LONG
        - BODY_TOO_LONG_FOR_BULK
        - CONTENT_PROHIBITED
        - LINK_BLOCKED
        - LINK_PUBLIC_SHORTENER
        - TOO_MANY_LINKS
        - MEDIA_NOT_FOUND
        - MEDIA_COUNT_EXCEEDED
        - MEDIA_TOO_LARGE
        - REFERENCE_ID_EXISTS
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
        -
          $ref: '#/components/parameters/MyCommAccount'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            examples:
              text:
                summary: 'Text message to a number'
                value:
                  to: '+923001234567'
                  body: 'Your order #1094 is ready for pickup.'
                  reference_id: order-1094
                  metadata:
                    order_id: '1094'
              template:
                summary: 'Template to a saved contact'
                value:
                  contact_id: 0198ea17-5c28-7b94-8e07-3a9d1f4c6b05
                  template_id: 0198ec30-4d12-7b6a-8f21-9a3c5e7d1b08
                  variables:
                    name: Amina
                    order: '1094'
              scheduled_marketing:
                summary: 'Marketing message sent later'
                value:
                  to: '+923001234567'
                  body: 'Eid sale: 20% off until Sunday. Reply STOP to opt out.'
                  category: marketing
                  send_after: '2026-10-03T08:00:00Z'
                  expires_in: 86400
              dry_run:
                summary: 'Check without sending'
                value:
                  to: '+923001234567'
                  body: 'Your order #1094 is ready for pickup.'
                  dry_run: true
      responses:
        200:
          description: 'Dry run only. The would-be message plus the non-fatal warnings; nothing was written.'

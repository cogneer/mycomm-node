    post:
      operationId: createWebhookEndpoint
      tags:
        - Webhooks
      summary: 'Create a webhook endpoint'
      description: "Requires `webhooks:write`. The `url` must be `https`, carry no credentials and resolve only to public\naddresses. `events` empty or omitted means every event except the opt-in ones. `inbox_ids` and\n`channel_types` `null` mean all. At most 20 endpoints per account. A restricted key's endpoint defaults to\n(and must stay inside) its inboxes, takes the key's channel types and cannot include managed accounts.\nThe `secret` is shown once, in this response.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              if:
                properties:
                  include_managed_accounts:
                    const: true
                required:
                  - include_managed_accounts
              then:
                properties:
                  inbox_ids:
                    type: 'null'
              x-required-when:
                -
                  field: inbox_ids
                  when: 'include_managed_accounts is true'
                  rule: must_be_null
                  error: VALIDATION_FAILED
                  note: "A partner-wide endpoint receives every inbox of every managed account. Only an approved partner's own account, with an unrestricted key, may include managed accounts."
              properties:
                url:
                  type: string
                  maxLength: 2048
                description:
                  type:
                    - string
                    - 'null'
                  maxLength: 255
                events:
                  oneOf:
                    -
                      type: array
                      items:
                        $ref: '#/components/schemas/WebhookEventType'
                    -
                      type: 'null'
                inbox_ids:
                  oneOf:
                    -
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '#/components/schemas/Uuid'
                    -
                      type: 'null'
                channel_types:

    get:
      operationId: listMessages
      tags:
        - Messages
      summary: 'List and search messages'
      description: "Messages of the account, newest first, with cursor pagination. Requires `messages:read`.\nA restricted key lists only the messages of its inboxes. Comma lists match any of the values.\n`q` is a full-text search on `body` (at least 2 characters, Postgres `simple` configuration, so Urdu and Roman Urdu\nmatch word by word) and always sorts newest first.\n"
      parameters:
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
        -
          name: inbox_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: channel_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: conversation_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: contact_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: campaign_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: direction
          in: query
          schema:
            $ref: '#/components/schemas/MessageDirection'
        -
          name: reference_id
          in: query
          description: 'Exact match; returns 0 or 1 item.'
          schema:
            type: string
        -
          name: status
          in: query
          description: 'One value or a comma list.'
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MessageStatus'
        -
          name: type
          in: query
          description: 'One value or a comma list.'
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MessageType'
        -
          name: category
          in: query
          description: 'One value or a comma list.'
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MessageCategory'
        -
          name: lane
          in: query
          description: 'One value or a comma list.'
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MessageLane'
        -
          name: origin
          in: query
          description: 'One value or a comma list.'
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MessageOrigin'
        -
          name: failure_code
          in: query
          description: 'Comma list.'
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        -
          name: channel_type
          in: query
          description: 'Comma list.'
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        -
          name: content_type
          in: query
          description: 'One value or a comma list.'
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MessageContentType'
        -
          name: hold_reason
          in: query
          description: 'One value or a comma list.'
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/HoldReason'
        -
          name: to
          in: query
          description: 'Recipient address; phone numbers in any accepted format are normalised.'
          schema:
            type: string
        -
          name: from
          in: query
          description: 'Sender address; phone numbers in any accepted format are normalised.'
          schema:
            type: string
        -
          name: q
          in: query
          description: 'Full-text search on the body, at least 2 characters.'
          schema:
            type: string
            minLength: 2
        -
          name: created_after
          in: query
          description: 'Inclusive lower bound.'
          schema:
            $ref: '#/components/schemas/Timestamp'
        -
          name: created_before
          in: query
          description: 'Exclusive upper bound.'
          schema:
            $ref: '#/components/schemas/Timestamp'
        -
          name: sort
          in: query
          description: '`-created_at` (default) or `created_at`; ignored when `q` is given.'
          schema:
            type: string
            enum:
              - '-created_at'
              - created_at
            default: '-created_at'
        -
          $ref: '#/components/parameters/MyCommAccount'

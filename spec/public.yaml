      summary: 'Suppress a number'
      description: "Requires `suppressions:write` (never held by a restricted key). `identity_type` defaults to\n`phone` (the only type in v1) and `reason` to `api`; the API may write `api`, `complaint` or `dnc`. The address\nis stored in E.164 (a number without country code is read in the account country; one that is not a valid\nnumber is `422 VALIDATION_FAILED` with `INVALID_NUMBER` on `address`). A new suppression answers `201`, writes\na `consent_events` `opt_out` (method `api`) and emits `contact.opted_out`; the identity's queued marketing is\ncancelled. A number that is already suppressed, for any reason, answers `200` with the existing row unchanged.\nWith the account setting `opt_out.scope: contact`, a number that belongs to a contact suppresses every identity\nof that contact not suppressed yet, each with its own consent event and `contact.opted_out`, as a STOP reply\ndoes; the answer is still the row of the number given.\n"

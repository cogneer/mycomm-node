        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: rotateApiKey
      tags:
        - 'API keys'
      summary: 'Rotate an API key'
      description: "Requires `keys:write`. Creates a new key with the same name, scope, abilities, allowed IPs and expiry, and returns its\n`token` once. The old key keeps working for `grace_period_hours` (default 24, at most 168) so you can deploy the new\ntoken without a gap; with `0` it is revoked at once. The old key's expiry never moves later than it already was.\nA restricted caller can rotate only keys inside its own scope. A revoked or expired key cannot be rotated.\n"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_period_hours:
                  type: integer
                  minimum: 0
                  maximum: 168
                  default: 24
      responses:
        201:
          description: 'The new key, including its `token`, and what happened to the old key.'

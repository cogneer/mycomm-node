        - leased
        - released
        - orphaned
        - cancel_requested
        - cancel_failed
        - sent
        - dlr_part
        - delivered
        - read
        - failed
        - retry_scheduled
        - late_sent
        - late_delivered
        - expired
        - cancelled
        - received
        - provider_ack
        - provider_call_started
        - edited
        - deleted_remote
    MessageEvent:

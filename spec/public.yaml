                  note: '`body` is always sent; it may be `null` or blank only when `media_id` is given.'
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                body:
                  type:
                    - string
                    - 'null'
                  maxLength: 3000
                  description: 'Required unless `media_id` is given.'
                category:
                  $ref: '#/components/schemas/TemplateCategory'
                media_id:
                  oneOf:

        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        413:
          $ref: '#/components/responses/PayloadTooLarge'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        -
          $ref: '#/components/parameters/MyCommAccount'
    delete:
      operationId: deleteContact
      tags:
        - Contacts
      summary: 'Delete a contact'
      description: "Requires `contacts:write`. Soft delete: the contact is hidden from lists, groups and audiences while its\nconversations and messages stay; emits `contact.deleted` (`erased: false`) and answers `204`.\nWith `?erase=true` (GDPR erasure) the contact, its identities, group memberships,\nconversations, messages, message events, media, short links and link clicks are permanently deleted by a\nqueued job, which emits `contact.deleted` (`erased: true`); suppressions and consent events (plain E.164)\nand aggregates (`usage_daily`, campaign stats) are kept. Answers `202 {\"status\": \"erasing\"}`; a\nsoft-deleted contact can be erased too.\n"
      parameters:
        -
          name: erase
          in: query
          description: '`true` erases the contact and everything on the erasure list.'
          schema:
            type: boolean
        -
          $ref: '#/components/parameters/MyCommAccount'
      responses:
        202:
          description: 'The erasure is queued.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - erasing
        204:
          description: 'The contact is deleted.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        400:

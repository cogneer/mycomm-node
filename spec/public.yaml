                    properties:
                      type:
                        const: campaign_report
                    required:
                      - type
                  then:
                    required:
                      - params
                    properties:
                      params:
                        type: object
                        required:
                          - campaign_id
                        properties:
                          campaign_id:
                            $ref: '#/components/schemas/Uuid'
              x-required-when:
                -
                  field: 'params.created_after, params.created_before'
                  when: 'type is messages_csv'
                  error: VALIDATION_FAILED
                  note: 'The other `GET /v1/messages` filters are optional.'
                -
                  field: params.contact_id
                  when: 'type is contact_json'
                  error: VALIDATION_FAILED
                -
                  field: params.campaign_id
                  when: 'type is campaign_report'
                  error: VALIDATION_FAILED
              properties:
                type:
                  $ref: '#/components/schemas/ExportType'
                params:
                  type: object
                  additionalProperties: true
                  description: "Per `type`. `messages_csv`: the `GET /v1/messages` filters, `created_after` and `created_before`\nrequired. `contacts_csv`: optional `group_id`, `smart_list_id`, `filter.q`, `contact_ids`,\n`columns`, `excel_bom`. `contact_json`: `contact_id`. `campaign_report`: `campaign_id`.\n`account_zip`: none.\n"
      responses:
        202:
          description: 'The export, `queued`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:

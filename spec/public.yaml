      description: "Sends 1-1,000 messages in one call. Requires `messages:send`. Each item has the fields of\n`POST /v1/messages` except `dry_run`; `defaults` supplies any field an item omits and the item's value wins.\n`category` is required on every item, in the item or in `defaults` (there is no implicit `transactional` here).\n\nItems are accepted or rejected independently, in order: the answer is always `200` with a `summary` and one\n`results[]` entry per item, also when every item was rejected. An item error carries the code of the matching single\nsend (`INVALID_NUMBER`, `CATEGORY_REQUIRED`, `RECIPIENT_OPTED_OUT`, ...). A `reference_id` already used by the\naccount, or earlier in the same batch, rejects that item with `REFERENCE_ID_EXISTS`.\n\n`Idempotency-Key` covers the whole batch: a repeat replays the stored `200`. `dry_run: true` runs every item through\nthe same checks and stores nothing; accepted entries then carry a message preview with `id` and `status` null.\n\nEnvelope problems answer `422` and nothing is processed: `BATCH_TOO_LARGE` (`details.max`, 1,000) or\n`VALIDATION_FAILED`.\n"

      description: "Requires `campaigns:write`. Creates a `draft`: `body` or `template_id` (a copy), the audience\n(`group_ids`, `smart_list_ids`, `import_id` of a contacts CSV import, and at most 10,000 `addresses`), defaults for\n`category` (`marketing`), `append_opt_out_text` (`true` for marketing), `shorten_links` and `track_clicks` (`true`).\n`compliance.consent_asserted: true` stamps the assertion with the caller. `channel_id` is read-only. The save-time\nstart checks answer `422` with their own code (`CHANNEL_INACTIVE`, `INBOX_ARCHIVED`, `BODY_EMPTY`,\n`TEMPLATE_INVALID`, `TEMPLATE_ARCHIVED`, `CHANNEL_CAPABILITY_UNSUPPORTED`, `MEDIA_TYPE_UNSUPPORTED`,\n`AUDIENCE_EMPTY`, `LINK_BLOCKED`, `LINK_PUBLIC_SHORTENER`, `TOO_MANY_LINKS`, `CONTENT_PROHIBITED`,\n`CATEGORY_MISMATCH`); a malformed body or an over-long list answers `VALIDATION_FAILED`.\n`audience.import_id` names a `contacts_csv` import uploaded through `/imports`: the campaign gets its own campaign\nCSV import over the same file, queued at once, whose rows become the campaign's recipients, and\n`audience.import_id` then holds that import's id. An import of another account, of another type, `failed` or\n`cancelled`, or a second CSV answers `422 VALIDATION_FAILED`; an import already the CSV of another campaign\nanswers `409 INVALID_STATE`.\n"

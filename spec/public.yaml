        tag:
          type: string
          maxLength: 60
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    AutomationFlagAction:
      type: object
      description: 'Marks the conversation read, or archives it.'
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - mark_read
            - archive
    AutomationRuleCreate:
      type: object
      description: "The body of `POST /inboxes/{id}/automation-rules`. The inbox comes from the path. Fields that are not listed\nhere, such as `id`, `inbox_id`, `actor` or the timestamps, are `422`.\n"
      additionalProperties: false
      required:
        - type
        - name
        - actions
      if:
        properties:
          type:
            const: keyword
        required:
          - type
      then:
        required:
          - match
      x-required-when:
        -
          field: match
          when: 'type is keyword'
          error: VALIDATION_FAILED
      properties:
        type:
          type: string
          enum:
            - keyword
            - away
        name:
          type: string
          minLength: 1
          maxLength: 60
        active:
          type: boolean
          default: true
        match:
          $ref: '#/components/schemas/AutomationRuleMatchInput'
        actions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/AutomationAction'
        cooldown_minutes:
          type: integer
          minimum: 0
          maximum: 10080
          default: 720
        schedule:
          type:
            - 'null'
          description: 'Must be `null` or omitted.'
        position:
          type: integer
          minimum: 1
          description: 'Keyword rules only; from 1 to the number of keyword rules plus one. Default last.'
    AutomationRuleMatchInput:
      type: object
      description: 'Required for a keyword rule; ignored for the away message. 1 to 20 keywords of at most 30 characters. Opt-out and opt-in keywords are reserved.'
      additionalProperties: false
      required:
        - mode
        - keywords
      properties:
        mode:
          type: string
          enum:
            - exact
            - starts_with
            - contains
        keywords:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 30
        case_sensitive:
          type: boolean
          default: false
    AutomationRuleUpdate:
      type: object
      description: "The body of `PATCH /inboxes/{id}/automation-rules/{rule_id}`: any of the create fields except `type`, and\n`inbox_id`. Sending `type` or `inbox_id` is `422 VALIDATION_FAILED`. Unlisted fields are `422` too.\n"
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        active:
          type: boolean
        match:
          $ref: '#/components/schemas/AutomationRuleMatchInput'
        actions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/AutomationAction'
        cooldown_minutes:
          type: integer
          minimum: 0
          maximum: 10080
        schedule:
          type:
            - 'null'
          description: 'Must be `null` when sent.'
        position:
          type: integer
          minimum: 1
          description: 'Moves a keyword rule to this place among the keyword rules of its inbox.'
    AutomationRulesReorder:
      type: object
      additionalProperties: false
      required:
        - rule_ids
      properties:
        rule_ids:
          type: array
          maxItems: 200
          description: 'Every keyword rule of the inbox exactly once, in the new order.'
          items:
            $ref: '#/components/schemas/Uuid'
    AutomationDryRunRequest:
      type: object
      description: 'The body of `POST /inboxes/{id}/automation-rules/test`. Fields that are not listed here are `422`.'
      additionalProperties: false
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1600
          description: 'The text of the inbound message to test.'
        contact_id:
          description: 'The sender, a contact of the account; needs `contacts:read`. Omitted or `null` tests an unknown sender.'
          oneOf:
            -
              $ref: '#/components/schemas/Uuid'
            -
              type: 'null'
        at:
          description: 'The instant the message would arrive, RFC 3339 with `Z` or an offset. Omitted or `null` is now.'
          oneOf:
            -
              $ref: '#/components/schemas/Timestamp'
            -
              type: 'null'
    AutomationDryRun:
      type: object
      description: 'What the automation would do with the message. Nothing was sent or written.'
      required:
        - matched_rule_id
        - rule_type
        - actions
        - reply_preview
        - outcome
      additionalProperties: false
      properties:
        matched_rule_id:
          description: 'The rule that would run; `null` for `no_match` and for a paused conversation.'
          oneOf:
            -
              $ref: '#/components/schemas/Uuid'
            -
              type: 'null'
        rule_type:
          type:
            - string
            - 'null'
          enum:
            - keyword
            - away
            - null
        actions:
          type: array
          description: "The rule's actions as stored on it, in order. When the run would apply but the reply is held back (the\naway message to an opted-out contact), the reply is left out.\n"
          items:
            $ref: '#/components/schemas/AutomationAction'
        reply_preview:
          description: 'The reply rendered for the sender, or `null` when the rule sends none.'
          oneOf:
            -
              $ref: '#/components/schemas/AutomationReplyPreview'
            -
              type: 'null'
        outcome:
          type: string
          enum:
            - applied
            - 'skipped:cooldown'
            - 'skipped:channel_cap'
            - 'skipped:loop_guard'
            - no_match
          description: "`applied` would run the actions; `skipped:*` is the guard that would hold the reply back (a paused\nconversation is `skipped:loop_guard`); `no_match` runs nothing.\n"
    AutomationReplyPreview:
      type: object
      required:
        - body
        - segments
      additionalProperties: false
      properties:
        body:
          type: string
          description: 'The final text, template variables filled in for the sender.'
        segments:
          type: integer
          minimum: 1
          description: 'SMS parts the reply would take.'
    AutomationRun:
      type: object
      description: 'One evaluation of a rule, append-only.'
      required:
        - id
        - rule_id
        - inbox_id
        - conversation_id
        - trigger_message_id
        - outcome
        - actions_result
        - created_at
      additionalProperties: false
      properties:
        id:
          type: integer
          description: 'Increasing run id.'
        rule_id:
          $ref: '#/components/schemas/Uuid'
        inbox_id:
          $ref: '#/components/schemas/Uuid'
        conversation_id:
          $ref: '#/components/schemas/Uuid'
        trigger_message_id:
          $ref: '#/components/schemas/Uuid'
        outcome:
          type: string
          enum:
            - applied
            - 'skipped:cooldown'
            - 'skipped:channel_cap'
            - 'skipped:loop_guard'
        actions_result:
          description: "What each action of the rule did, one element per action in the rule's order. A guard skip lists the\nheld-back reply as `skipped` and the other actions as they ran; the away message to an opted-out contact\nlists no reply. The run that starts a ping-pong pause is the object `{\"guard\": \"ping_pong\", \"actions\": [...]}`\nwith that list under `actions`.\n"
          oneOf:
            -
              type: array
              items:
                $ref: '#/components/schemas/AutomationActionResult'
            -
              type: object
              required:
                - guard
                - actions
              additionalProperties: false
              properties:
                guard:
                  type: string
                  enum:
                    - ping_pong
                actions:
                  type: array
                  items:
                    $ref: '#/components/schemas/AutomationActionResult'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    AutomationActionResult:
      type: object
      description: "One action of a run. `status` is `queued` for a reply accepted as a message (`message_id`),\n`applied` for any other action done or already in place (`group_id` for group actions, `tag` for a tag),\n`failed` when the action could not run (`error`: a send-check code such as `CHANNEL_INACTIVE`,\n`group_not_found`, `contact_not_found`, `tag_invalid`, `unknown_action`, `internal_error`, ...) and `skipped`\nfor a reply a guard held back (`reason`, the outcome without `skipped:`).\n"
      required:
        - type
        - status
      additionalProperties: false
      properties:
        type:
          type: string
          description: "The action's `type` as stored on the rule."
        status:
          type: string
          enum:
            - queued
            - applied
            - failed
            - skipped
        message_id:
          $ref: '#/components/schemas/Uuid'
        group_id:
          $ref: '#/components/schemas/Uuid'
        tag:
          type: string
        error:
          type: string
        reason:
          type: string
          enum:
            - cooldown
            - channel_cap
            - loop_guard
    CampaignRecipientStatus:
      type: string
      enum:
        - pending
        - queued
        - skipped
        - sent
        - delivered
        - failed
        - expired
        - cancelled
    CampaignRecipientSkipReason:
      type: string
      enum:
        - suppressed
        - duplicate
        - invalid_number
        - not_mobile
        - foreign_number
        - blocked
        - no_identity
        - no_identity_for_channel
        - no_prior_contact
        - not_reachable
        - no_consent
        - body_too_long
    CampaignRecipient:
      type: object
      additionalProperties: false
      description: 'One recipient of a campaign; its status mirrors its message.'
      required:
        - id
        - contact_id
        - contact_identity_id
        - address
        - status
        - skip_reason
        - message_id
        - variables
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        contact_id:
          type:
            - string
            - 'null'
          format: uuid
        contact_identity_id:
          type:
            - string
            - 'null'
          format: uuid
        address:
          type: string
        status:
          $ref: '#/components/schemas/CampaignRecipientStatus'
        skip_reason:
          oneOf:
            -
              $ref: '#/components/schemas/CampaignRecipientSkipReason'
            -
              type: 'null'
        message_id:
          type:
            - string
            - 'null'
          format: uuid
        variables:
          type: object
          description: "The recipient's snapshot variables."
          additionalProperties: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    CampaignReport:
      type: object
      additionalProperties: false
      required:
        - campaign_id
        - status
        - stats
        - rates
        - failures_by_code
        - timeline
        - links
        - started_at
        - completed_at
      properties:
        campaign_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/CampaignStatus'
        stats:
          type: object
          description: '`campaigns.stats`, as on the campaign resource.'
          required:
            - total
            - sent
            - delivered
            - failed
          properties:
            total:
              type: integer
            sent:
              type: integer
            delivered:
              type: integer
            failed:
              type: integer
            replies:
              type: integer
            opt_outs:
              type: integer
            clicks:
              type: integer
            unique_clicks:
              type: integer
            skipped:
              type: object
              additionalProperties:
                type: integer
        rates:
          type: object
          additionalProperties: false
          required:
            - delivery_rate
            - failure_rate
            - reply_rate
            - opt_out_rate
            - click_rate
          properties:
            delivery_rate:
              type:
                - number
                - 'null'
              minimum: 0
              maximum: 1
            failure_rate:
              type:
                - number
                - 'null'
              minimum: 0
              maximum: 1
            reply_rate:
              type:
                - number
                - 'null'
              minimum: 0
              maximum: 1
            opt_out_rate:
              type:
                - number
                - 'null'
              minimum: 0
              maximum: 1
            click_rate:
              type:
                - number
                - 'null'
              minimum: 0
              maximum: 1
        failures_by_code:
          type: object
          description: 'Failure code to count.'
          additionalProperties:
            type: integer
        timeline:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - hour
              - sent
              - delivered
              - failed
            properties:
              hour:
                $ref: '#/components/schemas/Timestamp'
              sent:
                type: integer
              delivered:
                type: integer
              failed:
                type: integer
        links:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - target_url
              - clicks
              - unique_clicks
            properties:
              target_url:
                type: string
              clicks:
                type: integer
                description: "Human clicks on the campaign's short links to this URL."
              unique_clicks:
                type: integer
                description: 'Recipients who clicked it at least once (bot clicks excluded).'
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
    CampaignStatus:
      type: string
      enum:
        - draft
        - scheduled
        - running
        - paused
        - completed
        - cancelled
    CampaignActor:
      type: object
      description: 'Who did it; `id` is null for the system.'
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type:
            - string
            - 'null'
    CampaignAudience:
      type: object
      description: '`addresses` is left out of the items of `GET /campaigns`; `GET /campaigns/{id}` returns it.'
      required:
        - group_ids
        - smart_list_ids
        - import_id
      properties:
        group_ids:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Uuid'
        smart_list_ids:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Uuid'
        import_id:
          description: 'The campaign CSV import whose rows are the audience (created from the contacts CSV import given on create or update).'
          oneOf:
            -
              $ref: '#/components/schemas/Uuid'
            -
              type: 'null'
        addresses:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/CampaignAddress'
    CampaignAddress:
      type: object
      required:
        - address
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 64
          examples:
            - '+923451234567'
        variables:
          $ref: '#/components/schemas/CampaignVariables'
    CampaignVariables:
      type: object
      description: 'At most 50 values, each a string, number or boolean of at most 1,000 characters.'
      maxProperties: 50
      additionalProperties:
        type:
          - string
          - number
          - boolean
        maxLength: 1000
    Campaign:
      type: object
      description: 'The campaign resource. `channel_id` is read-only, derived from `inbox_id`.'
      required:
        - id
        - name
        - inbox_id
        - channel_id
        - status
        - body
        - template_id
        - media_id
        - variables
        - audience
        - exclude
        - category
        - compliance
        - append_opt_out_text
        - shorten_links
        - track_clicks
        - scheduled_at
        - started_at
        - paused_at
        - completed_at
        - cancelled_at
        - eta_at
        - stats
        - actor
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        inbox_id:
          $ref: '#/components/schemas/Uuid'
        channel_id:
          type:
            - string
            - 'null'
          format: uuid
        status:
          $ref: '#/components/schemas/CampaignStatus'
        body:
          type:
            - string
            - 'null'
        template_id:
          type:
            - string
            - 'null'
          format: uuid
        media_id:
          type:
            - string
            - 'null'
          format: uuid
        variables:
          $ref: '#/components/schemas/CampaignVariables'
        audience:
          $ref: '#/components/schemas/CampaignAudience'
        exclude:
          type: object
          required:
            - group_ids
          properties:
            group_ids:
              type: array
              items:
                $ref: '#/components/schemas/Uuid'
        category:
          type: string
          enum:
            - marketing
            - transactional
        compliance:
          type: object
          required:
            - consent_asserted_at
            - consent_asserted_by
            - service_message
          properties:
            consent_asserted_at:
              type:
                - string
                - 'null'
              format: date-time
            consent_asserted_by:
              oneOf:
                -
                  $ref: '#/components/schemas/CampaignActor'
                -
                  type: 'null'
            service_message:
              type: boolean
        append_opt_out_text:
          type: boolean
        shorten_links:
          type: boolean
        track_clicks:
          type: boolean
        scheduled_at:
          type:
            - string
            - 'null'
          format: date-time
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        paused_at:
          type:
            - string
            - 'null'
          format: date-time
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
        cancelled_at:
          type:
            - string
            - 'null'
          format: date-time
        eta_at:
          type:
            - string
            - 'null'
          format: date-time
        stats:
          type: object
          description: '`campaigns.stats`; `skipped` counts rows by skip reason.'
          required:
            - total
            - skipped
          properties:
            total:
              type: integer
            excluded:
              type: integer
            duplicates:
              type: integer
            expanded_at:
              type:
                - string
                - 'null'
              format: date-time
            skipped:
              type: object
              additionalProperties:
                type: integer
          additionalProperties: true
        actor:
          $ref: '#/components/schemas/CampaignActor'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    CampaignFields:
      type: object
      description: 'The fields POST and PATCH share. Unknown keys are ignored.'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        inbox_id:
          $ref: '#/components/schemas/Uuid'
        body:
          type:
            - string
            - 'null'
          maxLength: 4000
          description: 'The message text; exclusive with `template_id`.'
        template_id:
          type:
            - string
            - 'null'
          format: uuid
          description: 'A template whose body and picture are copied into the campaign; exclusive with `body`.'
        media_id:
          type:
            - string
            - 'null'
          format: uuid
        variables:
          $ref: '#/components/schemas/CampaignVariables'
        audience:
          type: object
          properties:
            group_ids:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/Uuid'
            smart_list_ids:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/Uuid'
            import_id:
              type:
                - string
                - 'null'
              format: uuid
            addresses:
              type: array
              maxItems: 10000
              items:
                $ref: '#/components/schemas/CampaignAddress'
        exclude:
          type: object
          properties:
            group_ids:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/Uuid'
        category:
          type: string
          enum:
            - marketing
            - transactional
          default: marketing
        compliance:
          type: object
          properties:
            consent_asserted:
              type: boolean
              default: false
              description: '`true` stamps `consent_asserted_at` and `consent_asserted_by` with the caller.'
            service_message:
              type: boolean
              default: false
              description: 'Requires `category` transactional, else `422 VALIDATION_FAILED`.'
        append_opt_out_text:
          type: boolean
          description: 'Default `true` for marketing, `false` for transactional.'
        shorten_links:
          type: boolean
        track_clicks:
          type: boolean
          default: true
    CampaignCreate:
      allOf:
        -
          $ref: '#/components/schemas/CampaignFields'
        -
          type: object
          required:
            - name
            - inbox_id
          not:
            required:
              - body
              - template_id
          x-required-when:
            -
              field: 'body | template_id'
              rule: at_most_one
              error: VALIDATION_FAILED
              note: 'A campaign uses its own `body` or a template; either may wait until the campaign is started.'
    CampaignUpdate:
      allOf:
        -
          $ref: '#/components/schemas/CampaignFields'
    CampaignEstimate:
      type: object
      description: 'The review figures of a campaign; nothing is saved.'
      required:
        - recipients
        - skipped
        - segments_per_message
        - total_segments
        - start_at
        - eta_at
        - warnings
      properties:
        recipients:
          type: integer
        skipped:
          type: object
          additionalProperties:
            type: integer
        segments_per_message:
          type: object
          required:
            - min
            - max
          properties:
            min:
              type: integer
            max:
              type: integer
        total_segments:
          type: integer
        start_at:
          $ref: '#/components/schemas/Timestamp'
        eta_at:
          type:
            - string
            - 'null'
          format: date-time
        eta_beyond_60_days:
          type: boolean
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        missing_variables:
          type: object
          description: 'Recipients that lack a variable without fallback; `first` lists at most 20.'
          properties:
            count:
              type: integer
            first:
              type: array
              items:
                type: object
        risk:
          type: object
        consent:
          type: object
        landlines:
          type: integer
    ChannelUpdate:
      type: object

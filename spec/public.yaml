        encoding:
          type:
            - string
            - 'null'
        segments:
          type:
            - integer
            - 'null'
        type:
          $ref: '#/components/schemas/MessageType'
        hold_reason:
          oneOf:
            -
              $ref: '#/components/schemas/HoldReason'
            -
              type: 'null'
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SendMessageWarning'
    SendMessageWarning:

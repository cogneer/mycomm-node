  description: "For platforms that run MyComm for their own customers. Authenticate with a partner key (`mc_partner_...`) sent as\n`Authorization: Bearer <key>`.\n\n`/partner/v1` only creates, lists, changes, suspends and deletes managed accounts, mints their keys\nand reports usage across them. Everything a managed customer does goes through `/v1`\nwith the partner key plus the `MyComm-Account` header, or with a key minted for that account.\n\nConventions are those of `/v1`: JSON UTF-8, `snake_case` fields, UUIDv7 string ids,\nRFC 3339 UTC timestamps, cursor pagination, and the `/v1` error envelope on every non-2xx\nresponse, including unknown `/partner/v1` paths (`404 NOT_FOUND`). Every write needs a key that is\nnot read-only (`403 ABILITY_MISSING`). Clients must ignore unknown fields, enum values and error codes.\n"

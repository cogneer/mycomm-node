              properties:
                reason:
                  type: string
            request_id:
              type: string
              format: uuid
            doc_url:
              type: string
              format: uri
  responses:
    BadRequest:
      description: '400 MALFORMED_REQUEST (the body is not a JSON object; `details.reason` says why), INVALID_HEADER (`details.header`, `details.reason`, `details.expected`) or INVALID_CURSOR.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: '401 UNAUTHENTICATED: the key is missing (`details.reason: missing_key`), mistyped (`malformed_key`), unknown, revoked or expired.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '403 WRONG_KEY_KIND (not a partner key), ABILITY_MISSING (for example a read-only key on a write), IP_NOT_ALLOWED or PARTNER_ACCESS_REVOKED.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '404 NOT_FOUND: the line or account is absent, or belongs to another partner.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: '405 METHOD_NOT_ALLOWED.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: '409 conflict: EXTERNAL_REF_TAKEN, SUSPENDED_BY_SUPPORT, INVALID_STATE, IDEMPOTENCY_KEY_REUSED and the other 409 codes.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: '413 PAYLOAD_TOO_LARGE.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: '422 VALIDATION_FAILED (`details.fields`) or a specific business-rule code.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            anyOf:
              -
                $ref: '#/components/schemas/ValidationError'
              -
                $ref: '#/components/schemas/Error'
    RateLimited:
      description: '429 RATE_LIMITED. Wait `Retry-After` seconds.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: '500 INTERNAL_ERROR. Safe to retry with the same `Idempotency-Key`.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: '503 SERVICE_UNAVAILABLE. Honour `Retry-After`.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: '415 UNSUPPORTED_MEDIA_TYPE: the body is not in the format the endpoint takes. Send `Content-Type: application/json` (the two upload endpoints take `multipart/form-data`). `details.header`, `details.received` and `details.expected` say which.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrUnsupportedMediaType'
paths:
  '/lines/{id}/status':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      operationId: getPartnerLineStatus
      tags:
        - Lines
      summary: "Get a line's status"
      description: "Requires `lines:read`. How the line is doing now, computed at the time of the call. `not_connected` until the\nuser's first number is verified on the line; then `connected`, or `needs_attention` with the reasons. You are\ntold of every change by webhook: `line.connected`, `line.needs_attention` and `line.recovered` reach your\nendpoints that have `partner_lines`. `channels` counts the line's enabled senders per channel type (`healthy`:\ncan send now). `sponsorship` is null when the line has none. A line of another partner is `404 NOT_FOUND`.\n"
      responses:
        200:
          description: "The line's status."
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerLineStatus'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
      x-codeSamples:
        -
          lang: Shell
          label: curl
          source: "curl -X GET \"$MYCOMM_URL/partner/v1/lines/<id>/status\" \\\n  -H \"Authorization: Bearer $MYCOMM_API_KEY\""
  /lines:
    post:
      operationId: createPartnerLine
      tags:
        - Lines
      summary: 'Create a line'
      description: "Requires `lines:write`. Makes a line for one of your users in a new, empty MyComm account that becomes the\nuser's account when they connect a phone through a hosted link. `user_number` is only a hint for that page: it\nnever joins the line to an account that already has the number (that needs a code sent to the number), and the\nanswer is the same whether or not the number has an account. `external_ref` is unique among your live lines: a\ntaken one answers `409 EXTERNAL_REF_TAKEN` with the line in `details.line_id`. Detaching a line frees its\n`external_ref`. A `name` the account's Direct line has (\"Direct\") answers `409 NAME_TAKEN`.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartnerLineRequest'
      responses:
        201:
          description: 'The new line.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerLine'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        409:
          description: "409 EXTERNAL_REF_TAKEN: another live line of yours has this `external_ref` (`details.line_id`); or NAME_TAKEN: the name is the Direct line's."
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        413:
          $ref: '#/components/responses/PayloadTooLarge'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
    get:
      operationId: listPartnerLines
      tags:
        - Lines
      summary: 'List your lines'
      description: 'Requires `lines:read`. Newest first. Archived (detached) lines are left out unless `include_archived=true`, so an `external_ref` filter may then return a detached line beside the live one.'
      parameters:
        -
          name: external_ref
          in: query
          description: 'Exact match.'
          schema:
            type: string
        -
          name: include_archived
          in: query
          schema:
            type: boolean
            default: false
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
      responses:
        200:
          description: 'A page of lines.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/ListEnvelope'
                  -
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PartnerLine'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
      x-codeSamples:
        -
          lang: Shell
          label: curl
          source: "curl -X GET \"$MYCOMM_URL/partner/v1/lines\" \\\n  -H \"Authorization: Bearer $MYCOMM_API_KEY\""
  '/lines/{id}':
    parameters:
      -
        name: id
        in: path
        required: true
        description: 'The line id.'
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      operationId: getPartnerLine
      tags:
        - Lines
      summary: 'Get a line'
      description: 'Requires `lines:read`. Archived lines are returned too. A line of another partner is `404`.'
      responses:
        200:
          description: 'The line.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerLine'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
      x-codeSamples:
        -
          lang: Shell
          label: curl
          source: "curl -X GET \"$MYCOMM_URL/partner/v1/lines/<id>\" \\\n  -H \"Authorization: Bearer $MYCOMM_API_KEY\""
    patch:
      operationId: updatePartnerLine
      tags:
        - Lines
      summary: 'Change a line'
      description: "Requires `lines:write`. Changes `name` and `allowed_channel_types`; a field left out or `null` stays as it is.\n`external_ref` never changes (`422`). A name another line of the account has answers `409 NAME_TAKEN`.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartnerLineRequest'
      responses:
        200:
          description: 'The changed line.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'

            request_id: 0198f3a2-7c41-7e0b-9d52-6a1f3b8c4e11
            doc_url: 'https://api.mycomm.example/docs/errors#range-too-large'
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
            - request_id
            - doc_url
          properties:
            code:
              type: string
              const: RANGE_TOO_LARGE
            message:
              type: string
            details:
              type: object
              description: 'Specific to this code.'
              properties:
                max_days:
                  type: integer
              required:
                - max_days
            request_id:
              type: string
              format: uuid
            doc_url:
              type: string
              format: uri
    ErrUnsupportedMediaType:
      type: object
      description: 'Send the body in the format this endpoint expects, with a matching Content-Type header (application/json for JSON endpoints).'
      x-http-status: 415
      examples:
        -
          error:
            code: UNSUPPORTED_MEDIA_TYPE
            message: 'Send the body in the format this endpoint expects, with a matching Content-Type header (application/json for JSON endpoints).'
            details:
              header: Idempotency-Key
              received: example
              expected: example
            request_id: 0198f3a2-7c41-7e0b-9d52-6a1f3b8c4e11
            doc_url: 'https://api.mycomm.example/docs/errors#unsupported-media-type'
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
            - request_id
            - doc_url
          properties:
            code:
              type: string
              const: UNSUPPORTED_MEDIA_TYPE
            message:
              type: string
            details:
              type: object
              description: 'Specific to this code.'
              properties:
                header:
                  type: string
                received:
                  type:
                    - string
                    - 'null'
                expected:
                  type: string
            request_id:
              type: string
              format: uuid
            doc_url:
              type: string
              format: uri
    ErrRateLimited:
      type: object
      description: 'Too many requests. Wait for the time in the Retry-After header, then retry.'
      x-http-status: 429
      examples:
        -
          error:
            code: RATE_LIMITED
            message: 'Too many requests. Wait for the time in the Retry-After header, then retry.'
            details:
              retry_after_seconds: 30
            request_id: 0198f3a2-7c41-7e0b-9d52-6a1f3b8c4e11
            doc_url: 'https://api.mycomm.example/docs/errors#rate-limited'
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
            - request_id
            - doc_url
          properties:
            code:
              type: string
              const: RATE_LIMITED
            message:
              type: string
            details:
              type: object
              description: 'Specific to this code.'
              properties:
                retry_after_seconds:
                  type: integer
            request_id:
              type: string
              format: uuid
            doc_url:
              type: string
              format: uri
    ErrInternalError:
      type: object
      description: 'Something went wrong on our side. Retry with the same Idempotency-Key; if it keeps failing, quote the request_id to support.'
      x-http-status: 500
      examples:
        -
          error:
            code: INTERNAL_ERROR
            message: 'Something went wrong on our side. Retry with the same Idempotency-Key; if it keeps failing, quote the request_id to support.'
            details: {}
            request_id: 0198f3a2-7c41-7e0b-9d52-6a1f3b8c4e11
            doc_url: 'https://api.mycomm.example/docs/errors#internal-error'
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
            - request_id
            - doc_url
          properties:
            code:
              type: string
              const: INTERNAL_ERROR
            message:
              type: string
            details:
              type: object
              description: 'Specific to this code.'
            request_id:
              type: string
              format: uuid
            doc_url:
              type: string
              format: uri
    ErrServiceUnavailable:
      type: object
      description: 'The service is temporarily unavailable. Retry after the time in the Retry-After header.'
      x-http-status: 503
      examples:
        -
          error:
            code: SERVICE_UNAVAILABLE
            message: 'The service is temporarily unavailable. Retry after the time in the Retry-After header.'
            details:
              reason: 'Example text.'
            request_id: 0198f3a2-7c41-7e0b-9d52-6a1f3b8c4e11
            doc_url: 'https://api.mycomm.example/docs/errors#service-unavailable'
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
            - request_id
            - doc_url
          properties:
            code:
              type: string
              const: SERVICE_UNAVAILABLE
            message:
              type: string
            details:
              type: object
              description: 'Specific to this code.'
              properties:
                reason:
                  type: string
            request_id:
              type: string
              format: uuid
            doc_url:
              type: string
              format: uri
  responses:
    BadRequest:
      description: '400 MALFORMED_REQUEST (the body is not a JSON object; `details.reason` says why), INVALID_HEADER (`details.header`, `details.reason`, `details.expected`), ACCOUNT_CONTEXT_REQUIRED or INVALID_CURSOR.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: '401 UNAUTHENTICATED: the key is missing (`details.reason: missing_key`), mistyped (`malformed_key`), unknown, revoked or expired.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: "403 WRONG_KEY_KIND (not a partner key), ABILITY_MISSING (for example a read-only key on a write), IP_NOT_ALLOWED, PARTNER_ACCESS_REVOKED or PARTNER_KEY_RESTRICTED (the key's `allowed_account_ids` excludes the account, or forbids provisioning)."
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: "404 NOT_FOUND: the account or key is absent, purged, managed by another partner, or outside the key's `allowed_account_ids`."
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: '405 METHOD_NOT_ALLOWED.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: '409 conflict: EXTERNAL_REF_TAKEN, SUSPENDED_BY_SUPPORT, INVALID_STATE, IDEMPOTENCY_KEY_REUSED and the other 409 codes.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: '413 PAYLOAD_TOO_LARGE.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: '422 VALIDATION_FAILED (`details.fields`) or a specific business-rule code.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            anyOf:
              -
                $ref: '#/components/schemas/ValidationError'
              -
                $ref: '#/components/schemas/Error'
    RateLimited:
      description: '429 RATE_LIMITED. Wait `Retry-After` seconds.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: '500 INTERNAL_ERROR. Safe to retry with the same `Idempotency-Key`.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: '503 SERVICE_UNAVAILABLE. Honour `Retry-After`.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: '415 UNSUPPORTED_MEDIA_TYPE: the body is not in the format the endpoint takes. Send `Content-Type: application/json` (the two upload endpoints take `multipart/form-data`). `details.header`, `details.received` and `details.expected` say which.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrUnsupportedMediaType'
paths:
  /usage:
    get:
      operationId: getPartnerUsage
      tags:
        - Usage
      summary: 'Usage across managed accounts'
      description: "Dates are interpreted in each account's own time zone (as stored in `usage_daily`). Paginated over\naccounts, sorted by `sent_segments` descending. Counters match the usage reports in the portal; rows and\ntotals add `by_channel_type`. Per-day detail for one account: `GET /v1/stats/daily` acting as it.\n"
      parameters:
        -
          name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        -
          name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        -
          name: account_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
      responses:
        200:
          description: 'Totals and a page of per-account rows.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
      x-codeSamples:
        -
          lang: Shell
          label: curl
          source: "curl -X GET \"$MYCOMM_URL/partner/v1/usage\" \\\n  -H \"Authorization: Bearer $MYCOMM_API_KEY\""
  /accounts:
    post:
      operationId: provisionManagedAccount
      tags:
        - 'Managed accounts'
      summary: 'Provision a managed account'
      description: "Idempotent by `external_ref`. `201` creates a managed account with no users;\n`channels.auto_connect_sims` defaults to `true`. `200` returns the existing account with this\n`external_ref` **unchanged**, also when it is `pending_deletion` (the request's other fields are\nignored; use `PATCH`). Concurrent duplicates resolve to one account. Keys with\n`allowed_account_ids` get `403 PARTNER_KEY_RESTRICTED`; read-only keys `403 ABILITY_MISSING`.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionAccountRequest'
      responses:
        200:
          description: 'The existing account with this `external_ref`, unchanged.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        201:
          description: 'A new managed account.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: '403 PARTNER_KEY_RESTRICTED (`details.reason: account_list`, the key has `allowed_account_ids`), ABILITY_MISSING (read-only key), WRONG_KEY_KIND, IP_NOT_ALLOWED or PARTNER_ACCESS_REVOKED.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        413:
          $ref: '#/components/responses/PayloadTooLarge'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
    get:
      operationId: listManagedAccounts
      tags:
        - 'Managed accounts'
      summary: 'List managed accounts'
      description: 'A key with `allowed_account_ids` lists only those accounts.'
      parameters:
        -
          name: external_ref
          in: query
          description: 'Exact match.'
          schema:
            type: string
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - suspended
              - pending_deletion
        -
          name: q
          in: query
          description: 'Matches the name.'
          schema:
            type: string
        -
          name: created_after
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        -
          name: created_before
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        -
          name: needs_attention
          in: query
          description: '`true` for accounts with `counts.channels_needing_attention` above zero.'
          schema:
            type: boolean
        -
          name: sort
          in: query
          schema:
            type: string
            enum:
              - '-created_at'
              - name
            default: '-created_at'
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
      responses:
        200:
          description: 'A page of managed accounts.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/ListEnvelope'
                  -
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ManagedAccount'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
      x-codeSamples:
        -
          lang: Shell
          label: curl
          source: "curl -X GET \"$MYCOMM_URL/partner/v1/accounts\" \\\n  -H \"Authorization: Bearer $MYCOMM_API_KEY\""
  '/accounts/{id}':
    parameters:
      -
        $ref: '#/components/parameters/AccountId'
    get:
      operationId: getManagedAccount
      tags:
        - 'Managed accounts'
      summary: 'Get a managed account'
      responses:
        200:
          description: 'The account.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
      x-codeSamples:
        -
          lang: Shell
          label: curl
          source: "curl -X GET \"$MYCOMM_URL/partner/v1/accounts/<id>\" \\\n  -H \"Authorization: Bearer $MYCOMM_API_KEY\""
    patch:
      operationId: updateManagedAccount
      tags:
        - 'Managed accounts'
      summary: 'Update a managed account'
      description: "`settings` is deep-merged with the rules of `PATCH /v1/account`, plus `limits.max_daily_segments`\nand `channels.allowed_types`, which only the partner may set. The new `name` appears in the\npaired app. A taken `external_ref` is `409 EXTERNAL_REF_TAKEN`.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedAccountUpdate'
      responses:
        200:
          description: 'The updated account.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: '409 EXTERNAL_REF_TAKEN: another account of this partner has the `external_ref`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        413:
          $ref: '#/components/responses/PayloadTooLarge'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteManagedAccount
      tags:
        - 'Managed accounts'
      summary: 'Schedule deletion of a managed account'
      description: "Cancels queued messages and unfinished campaigns first, then revokes devices and account keys and\ndisconnects channels. Emits `account.deletion_scheduled`. `reactivate` before\n`purge_at` (14 days) restores the data.\n"
      responses:
        202:
          description: 'The account, `status: pending_deletion` with `purge_at`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        400:
